name: Deploy GitHub Pages

# Pages는 gh-pages 브랜치 서빙 모드 — Actions 배포(deploy-pages) 대신
# 빌드 결과를 gh-pages 브랜치에 push한다 (기존 수동 배포와 동일 경로).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web release
        # Pages에는 단일 HTML만 필요하다. AIT는 로컬 Toss 빌드 산출물이므로
        # GitHub runner에서 Granite CLI를 찾지 않도록 명시적으로 제외한다.
        run: ./build.sh --html-only
      - name: Prepare site
        run: |
          mkdir _site
          cp index.html '서울까지400km.html' _site/
          touch _site/.nojekyll
      - name: Push to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
