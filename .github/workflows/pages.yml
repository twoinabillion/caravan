name: Deploy GitHub Pages

# The standalone HTML may exceed Git's 100 MiB file limit. Publish it as a
# Pages artifact after the release gate succeeds, without recompressing art.
on:
  workflow_run:
    workflows: [gate]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build web release
        # Pages에는 단일 HTML만 필요하다. AIT는 로컬 Toss 빌드 산출물이므로
        # GitHub runner에서 Granite CLI를 찾지 않도록 명시적으로 제외한다.
        run: ./build.sh --html-only
      - name: Verify installable app shell
        run: node tools/check-pwa.mjs
      - name: Verify source and embedded assets
        run: |
          npm run verify:quick
          npm run test:source
      - name: Prepare site
        run: |
          mkdir -p _site/assets
          cp index.html '서울까지400km.html' mobile-preview.html _site/
          cp manifest.webmanifest service-worker.js _site/
          cp assets/app-icon.png assets/app-icon-192.png assets/app-icon-512.png _site/assets/
          touch _site/.nojekyll
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const html = fs.readFileSync('서울까지400km.html');
          fs.writeFileSync('_site/release.json', JSON.stringify({
            commit: execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim(),
            htmlSha256: crypto.createHash('sha256').update(html).digest('hex'),
            htmlBytes: html.length
          }, null, 2) + '\n');
          JS
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
