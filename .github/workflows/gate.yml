name: gate

# 게이트가 노트북 한 대의 기억력에 의존하지 않게 한다.
# push/PR: 빠른 층(빌드·lint·세이브·보안·결정성·골든 루트)
# 수동 실행: 장기 시뮬레이션까지 포함한 전체 릴리스 게이트
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          npm ci || npm install
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install -r tools/requirements-qa.txt playwright
          python -m playwright install --with-deps chromium
      - name: Build
        # AIT 패키징은 로컬 Toss 빌드 산출물이므로 러너에서는 HTML만 만든다 (pages.yml과 동일 이유)
        run: npm run build:html
      - name: Installable phone app shell
        run: npm run test:pwa
      - name: Content + dialogue lint
        run: npm run verify:quick
      - name: Source regression suite
        run: npm run test:source
      - name: Save migration fixtures
        run: npm run test:save
      - name: Security (LLM output escaping)
        run: npm run test:xss
      - name: Determinism
        run: npm run test:determinism
      - name: Core loop pressure
        run: npm run test:pressure
      - name: Combat rework
        run: npm run test:combat
      - name: Progression slots
        run: npm run test:slots
      - name: Golden route
        run: npm run test:golden
      - name: Viewport / build-string guard
        # 전체 아티팩트 게이트는 AIT 산출물이 필요해 로컬 전용 — 러너에서는 셸 검사만 한다
        run: node tools/check-release-shell.mjs

  full:
    # 장기 밸런스 시뮬레이션은 진단용이다. 일반 UI/콘텐츠 push를 빨갛게
    # 막지 않고, 출시 후보를 점검할 때 Actions에서 수동으로 실행한다.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          npm ci || npm install
          sudo apt-get update
          sudo apt-get install -y imagemagick
          python -m pip install -r tools/requirements-qa.txt playwright
          python -m playwright install --with-deps chromium
      - name: Full release gate
        run: npm run test:release
      - name: Upload simulation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-reports
          path: reports/
