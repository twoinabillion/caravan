<meta charset="utf-8">
<title>서울까지 400km</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<style>
:root{
  --night:#0b0e1a; --deep:#070910; --panel:#131829; --panel2:#0f1422; --line:#232b45;
  --amber:#ffb454; --amber-dim:#c98d47; --amber-glow:rgba(255,180,84,.14);
  --paper:#e8e3d5; --faded:#8b93ad; --dim:#747d9d;
  --danger:#e2574f; --ok:#7dc98f; --cheollian:#55e0c8;
  --safe-top:env(safe-area-inset-top,0px); --safe-right:env(safe-area-inset-right,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px); --safe-left:env(safe-area-inset-left,0px);
  --sans:"Apple SD Gothic Neo",Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Apple Myungjo","AppleMyungjo","Nanum Myeongjo","Noto Serif KR",serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--deep);color:var(--paper);font-family:var(--sans);overflow:hidden;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
input{font-family:inherit}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}

/* ── device column ── */
#frame{height:100dvh;display:flex;justify-content:center;background:
  radial-gradient(120% 90% at 50% 0%,#10152a 0%,var(--deep) 60%)}
#app{position:relative;width:100%;max-width:560px;height:100dvh;background:var(--night);
  overflow:hidden;overflow:clip;display:flex;flex-direction:column}
@media(min-width:600px){#app{box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.7)}}
/* 데스크톱 사이드 레일 — 새 시스템이 아니라 이미 있는 여정 정보의 재배치 */
#desk-rail{display:none}
@media(min-width:1200px){
  #frame{gap:20px;align-items:stretch}
  #desk-rail{display:flex;flex-direction:column;gap:10px;align-self:center;width:250px;
    padding:16px;border:1px solid var(--line);border-radius:14px;background:rgba(13,18,31,.6)}
  #desk-rail h4{margin:0 0 2px;color:var(--amber);font:12px/1.2 var(--mono);letter-spacing:.08em}
  #desk-rail .rail-sec{padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.06)}
  #desk-rail .rail-sec:last-child{border-bottom:0;padding-bottom:0}
  #desk-rail b{display:block;color:var(--paper);font-size:14px;line-height:1.35}
  #desk-rail small{display:block;margin-top:3px;color:#aeb7c9;font:12px/1.45 var(--mono)}
  #desk-rail p{margin:4px 0 0;color:#c3cad8;font-size:12px;line-height:1.5}
}
@media(min-width:900px){
  #app{max-width:840px}
  #scr-game>#dash,#scr-game>.mission-strip,#scr-game>#main{width:680px;max-width:100%;margin-left:auto;margin-right:auto}
  .sheet{width:min(680px,100%);margin-left:auto;margin-right:auto}
  #title-ui{width:min(560px,100%);margin-left:auto;margin-right:auto}
}

/* ── screens ── */
.scr{position:absolute;inset:0;display:none;flex-direction:column;background:var(--night);z-index:20}
.scr.on{display:flex}
#scr-game{position:relative;display:none;flex-direction:column;flex:1;min-height:0;height:100%;overflow:hidden;z-index:1}
#scr-game.on{display:flex}
#early-sound{position:absolute;z-index:55;top:calc(10px + var(--safe-top));right:calc(10px + var(--safe-right));
  min-width:44px;min-height:44px;padding:7px 12px;display:flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid rgba(232,227,213,.32);border-radius:22px;background:rgba(5,6,12,.76);color:#e1e3e8;
  font:12px/1.2 var(--mono);backdrop-filter:blur(7px);box-shadow:0 6px 22px rgba(0,0,0,.22)}
#early-sound[hidden]{display:none}
#early-sound.on{color:var(--amber);border-color:rgba(255,180,84,.48)}
#early-sound .sound-icon{font-size:14px}#early-sound .sound-label{white-space:nowrap}
#app[data-screen="intro"] #early-sound{left:calc(10px + var(--safe-left));right:auto}

/* ── stage / canvas ── */
#stage{position:relative;flex:0 0 clamp(210px,29dvh,310px);min-height:0;background:#000;overflow:hidden;
  border-bottom:1px solid rgba(255,180,84,.24)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:
  linear-gradient(180deg,rgba(7,9,16,.2),transparent 30%,transparent 62%,rgba(7,9,16,.58)),
  linear-gradient(90deg,rgba(7,9,16,.18),transparent 32%,transparent 72%,rgba(7,9,16,.12))}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
#titlecv{image-rendering:pixelated}
#bubbles{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;display:flex;flex-direction:column;
  align-items:flex-start;gap:6px;padding:10px 96px 10px 10px}
#road-status{position:absolute;z-index:5;left:12px;top:12px;max-width:min(68%,320px);pointer-events:none;
  display:grid;grid-template-columns:3px minmax(0,1fr);column-gap:9px;padding:9px 12px 9px 9px;
  border:1px solid rgba(232,227,213,.2);border-radius:3px 10px 10px 3px;
  background:linear-gradient(90deg,rgba(7,9,16,.88),rgba(11,14,26,.68));
  box-shadow:0 8px 24px rgba(0,0,0,.22);backdrop-filter:blur(5px);transition:opacity .2s,transform .2s}
#road-status::before{content:"";grid-row:1/4;width:3px;border-radius:2px;background:var(--amber);
  box-shadow:0 0 12px rgba(255,180,84,.52)}
#road-status-kicker,#road-status-place,#road-status-meta{grid-column:2;min-width:0}
#road-status-kicker{color:var(--amber);font:700 12px/1.2 var(--mono);letter-spacing:.16em}
#road-status-place{margin-top:2px;color:#f0ecdf;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#road-status-meta{margin-top:2px;color:#b7bfd0;font:12px/1.3 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bubbles:not(:empty)~#road-status{opacity:0;transform:translateY(-5px)}
.bubble{position:relative;max-width:min(100%,300px);background:rgba(12,15,26,.86);border:1px solid var(--line);
  border-radius:10px;padding:7px 9px;font-size:12px;line-height:1.45;color:var(--paper);
  display:flex;align-items:flex-start;gap:8px;
  opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s;
  backdrop-filter:blur(3px);box-shadow:0 5px 16px rgba(0,0,0,.18)}
.bubble.show{opacity:1;transform:translateY(0)}
.bubble-face{flex:none;width:32px;height:32px;border-radius:8px;object-fit:cover;image-rendering:pixelated;
  border:1px solid #39456f;background:#0a0d18}
.bubble-copy{min-width:0;display:flex;flex-direction:column;gap:2px}
.bubble .who{color:var(--amber);font:700 12px/1.25 var(--mono);letter-spacing:.03em}
.bubble.ai{border-color:rgba(85,224,200,.5);color:var(--cheollian);font-family:var(--mono);font-size:12px}
.bubble.ai .who{color:var(--cheollian)}
.bubble.radio{border-color:#4d4370;color:#d8ccff;font-size:12px;max-width:min(100%,320px)}
.bubble.narration{align-self:stretch;max-width:none;border:0;border-left:2px solid rgba(232,227,213,.48);
  border-radius:2px 8px 8px 2px;background:rgba(7,9,16,.84);color:#d8dae0;
  font-family:var(--serif);font-size:12px;line-height:1.48;box-shadow:none;margin-top:auto}
.bubble.thought{max-width:min(100%,285px);border-color:rgba(255,180,84,.25);
  background:rgba(22,20,26,.74);color:#d8d1c4;font-family:var(--serif);
  font-size:12px;font-style:italic;box-shadow:none;margin-top:auto}
.bubble.narration .who,.bubble.thought .who{color:#aeb5c8}
.bubble.narration .who{color:#c4c9d2}.bubble.narration .bubble-copy>span:last-child{color:#e0e2e7}
#minimap{position:absolute;top:8px;right:8px;width:78px;height:98px;z-index:6;cursor:pointer;
  background:rgba(8,11,22,0.62);border:1px solid rgba(60,80,130,0.55);border-radius:9px;
  backdrop-filter:blur(3px);transition:border-color .2s,opacity .25s,transform .25s;transform-origin:top right}
#minimap:hover{border-color:var(--amber-dim)}
/* 말풍선이 뜨는 동안 지도는 조용히 물러난다. 대화가 항상 우선이다. */
#bubbles:not(:empty)~#minimap{opacity:.12;transform:scale(.78);pointer-events:none}
.ait-runtime #minimap{top:calc(var(--safe-top) + 56px);right:calc(var(--safe-right) + 8px)}
.ait-runtime #bubbles{padding-top:calc(var(--safe-top) + 56px)}
@media(max-height:700px){
  #stage{flex-basis:clamp(195px,34dvh,238px)}
  #minimap{width:68px;height:84px}
  #bubbles{padding-right:84px}
}
#cheollian-tint{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s;
  background:radial-gradient(80% 60% at 50% 30%,rgba(85,224,200,.16),rgba(85,224,200,.05) 60%,transparent);
  mix-blend-mode:screen}
#cheollian-tint.on{opacity:1}

/* ── dashboard HUD ── */
#dash{flex:none;background:
  linear-gradient(180deg,rgba(23,28,45,.98),rgba(12,16,29,.98));border-top:1px solid rgba(255,180,84,.16);
  border-bottom:1px solid #27304d;padding:8px 10px 7px;position:relative}
#dash::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,180,84,.4),transparent)}
#gauges{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;align-items:stretch}
.g{min-width:0;padding:0 8px;border-right:1px solid rgba(255,255,255,.055)}
.g:first-child{padding-left:3px}.g:last-child{padding-right:3px;border-right:0}
.g .lab{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:#a9b1c8;display:flex;justify-content:space-between}
.g .val{font-family:var(--mono);font-size:13.5px;font-variant-numeric:tabular-nums;margin:1px 0 3px;white-space:nowrap}
.g .bar{height:3px;background:#0a0d18;border-radius:2px;overflow:hidden}
.g .bar i{display:block;height:100%;background:var(--amber);border-radius:2px;transition:width .4s}
.g.warn .val{color:var(--danger)}
.g.warn .bar i{background:var(--danger)}
#dash-sub{display:flex;justify-content:space-between;align-items:center;margin:7px -2px 0;padding:5px 5px 0;
  border-top:1px solid rgba(255,255,255,.05);font-family:var(--mono);font-size:12px;color:#a9b1c8}
#dash-sub .eye{color:var(--cheollian);letter-spacing:.06em}
#clockbox{font-variant-numeric:tabular-nums}

/* 현재 임무 — 메인과 전체 지도에서 같은 정보가 사라지지 않는다 */
.mission-strip{flex:none;width:100%;min-height:56px;border:0;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(255,180,84,.09),rgba(15,20,34,.98) 42%);
  padding:6px 12px;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 10px;
  color:var(--paper)}
.mission-strip .ms-k{grid-column:1;grid-row:1;font-family:var(--mono);font-size:12px;letter-spacing:.07em;color:var(--amber)}
.mission-strip .ms-title{grid-column:1;grid-row:2;font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mission-strip .ms-meta{grid-column:2;grid-row:1/5;align-self:center;font-family:var(--mono);
  font-size:12px;color:#bdc3d2;text-align:right;white-space:nowrap}
.mission-strip .ms-alert{color:#ff8f88;font-size:12px}
.mission-strip .ms-progress{grid-column:1;grid-row:4;height:2px;background:#080b14;border-radius:2px;overflow:hidden}
.mission-strip .ms-progress i{display:block;height:100%;background:var(--amber);border-radius:2px}
.mission-strip .ms-state{grid-column:1;grid-row:3;font-size:12.5px;color:#bdc3d2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mission-strip .ms-secondary-wrap{grid-column:1/3;grid-row:5;display:flex;flex-wrap:nowrap;gap:5px;margin-top:6px;padding:7px 0 1px;
  overflow-x:auto;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 92%,transparent);
  border-top:1px dashed rgba(226,87,79,.28);font:12px/1.35 var(--mono)}
.mission-strip .ms-secondary-wrap::-webkit-scrollbar{display:none}
.mission-strip .ms-sec-title{display:inline-flex;align-items:center;height:21px;padding:0 7px;border-radius:999px;
  background:rgba(226,87,79,.14);color:#ffc6a3;font-weight:700;white-space:nowrap}
.mission-strip .ms-chip{display:inline-flex;align-items:center;padding:4px 8px 4px 7px;border-radius:14px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,180,84,.25);color:#dfe4f0;white-space:nowrap}
.mission-strip .ms-chip.chip-core{border-color:#ffaaa5;background:rgba(255,170,165,.10);color:#ffd7ce}
.mission-strip .ms-chip.chip-recruit{border-color:rgba(125,201,143,.48);color:#b6f5bf;background:rgba(125,201,143,.08)}
.mission-strip .ms-chip.chip-quest{border-color:rgba(140,170,255,.38);color:#d5ddff;background:rgba(140,170,255,.08)}
.mission-strip .ms-main-clock{display:block;margin-top:3px;color:var(--amber);font-size:12px;font-weight:600}
.mission-strip.has-secondary{min-height:84px}
.mission-strip.danger{background:linear-gradient(90deg,rgba(226,87,79,.14),rgba(15,20,34,.98) 42%)}
.mission-strip.danger .ms-k,.mission-strip.danger .ms-meta{color:var(--danger)}
.map-mission{border-bottom:1px solid #2b3557;background:#10162a}

/* ── main content area ── */
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#panel{flex:1;min-height:0;overflow-y:auto;padding:10px 14px calc(64px + var(--safe-bottom));
  scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#panel h3{font-size:16px;letter-spacing:-.01em;margin-bottom:2px;text-wrap:balance}
#panel .sub{color:var(--faded);font-size:12.5px;margin-bottom:12px}
.journey-context{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-bottom:15px;padding:10px;
  border:1px solid #2b3552;border-radius:13px;background:
  linear-gradient(135deg,rgba(255,180,84,.075),transparent 42%),rgba(13,17,30,.9);
  box-shadow:inset 0 1px rgba(255,255,255,.025),0 8px 22px rgba(0,0,0,.12)}
.journey-context-head{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 2px 2px}
.journey-context-head span{color:var(--amber);font:700 12px/1.2 var(--mono);letter-spacing:.14em}
.journey-context-head small{color:#8f99af;font:12px/1.2 var(--mono)}
.context-location,.context-crew{min-width:0;border:1px solid rgba(255,255,255,.065);border-radius:9px;background:rgba(5,8,15,.36);
  min-height:47px;color:var(--paper);transition:border-color .15s,background .15s}
.context-location{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;
  column-gap:9px;align-items:center;padding:6px 10px;text-align:left}
.context-location:hover,.context-crew:hover{border-color:rgba(255,180,84,.38);background:rgba(255,180,84,.045)}
.context-location .loc-mark{grid-row:1/3;font-family:var(--mono);font-size:12px;letter-spacing:.08em;
  color:var(--amber);writing-mode:vertical-rl}
.context-location b{align-self:end;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.context-location small{align-self:start;color:#b9c0d1;font-family:var(--mono);font-size:12px;white-space:nowrap}
.context-crew{display:flex;align-items:center;gap:7px;padding:5px 9px}
.crew-faces{display:flex;padding-left:5px}
.crew-mini{width:25px;height:25px;margin-left:-6px;border-radius:50%;overflow:hidden;background:#0a0d18;
  border:1px solid #39456f;display:grid;place-items:center;font-size:12px}
.crew-mini:first-child{margin-left:0}.crew-mini .pimg{border-radius:50%}
.context-crew .crew-count{font-family:var(--mono);font-size:12px;color:#b9c0d1;white-space:nowrap}
.journey-guide{position:relative;margin:-4px 0 14px;padding:11px 12px 12px;border:1px solid rgba(85,224,200,.28);
  border-radius:12px;background:linear-gradient(135deg,rgba(85,224,200,.09),rgba(13,18,31,.96) 52%);
  box-shadow:inset 3px 0 rgba(85,224,200,.45)}
.journey-guide-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-5px -5px 3px 0}
.journey-guide-head span{color:var(--cheollian);font:700 12px/1.3 var(--mono);letter-spacing:.1em}
.journey-guide-head button{min-width:58px;min-height:44px;padding:0 8px;color:#aab4c7;font:12px/1 var(--mono);text-decoration:underline;text-underline-offset:3px}
.journey-guide>b{display:block;font-size:14px;line-height:1.35;color:#eef4f3}
.journey-guide>p{margin:3px 0 9px;color:#bfc9d2;font-size:12.5px;line-height:1.5}
.journey-guide-list{display:grid;gap:5px;margin:0 0 10px;padding:0;list-style:none}
.journey-guide-list li{position:relative;padding-left:15px;color:#cbd4db;font-size:12px;line-height:1.42}
.journey-guide-list li::before{content:'›';position:absolute;left:2px;top:-1px;color:var(--cheollian);font:700 16px/1 var(--mono)}
.journey-guide-track{height:3px;border-radius:3px;background:#071019;overflow:hidden}
.journey-guide-track i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3da693,var(--cheollian))}
.stl-intent{margin:8px 0 9px;padding:8px 10px;border-left:2px solid rgba(255,180,84,.62);background:rgba(255,180,84,.06)}
.stl-intent small{display:block;margin-bottom:2px;color:var(--amber);font:700 11px/1.25 var(--mono);letter-spacing:.1em}
.stl-intent span{display:block;color:#c5cddb;font-size:12px;line-height:1.42}
.road-note{color:#aeb5c8;font-size:12.5px;margin-top:8px;line-height:1.55}
.road-guest-card{margin-top:10px;border:1px solid rgba(255,180,84,.28);border-radius:12px;
  background:linear-gradient(145deg,rgba(255,180,84,.085),rgba(19,25,43,.94));padding:12px 13px}
.road-guest-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.road-guest-head .rg-ico{width:31px;height:31px;display:grid;place-items:center;border-radius:9px;
  background:rgba(255,180,84,.12);font-size:17px}
.road-guest-head small{display:block;color:var(--amber);font:12px/1.3 var(--mono);letter-spacing:.08em}
.road-guest-head b{display:block;font-size:14px;margin-top:1px}
.road-guest-help{font-size:12.5px;line-height:1.5;color:#d1d5df}
.road-guest-memory{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:#aeb5c8;
  font:12px/1.55 var(--serif)}
.road-checkin{display:grid;gap:8px;margin-top:10px;padding:11px 12px;border:1px solid rgba(126,165,229,.28);border-radius:12px;
  background:linear-gradient(145deg,rgba(93,126,190,.1),rgba(13,18,31,.95))}.road-checkin small{display:block;color:#a9c6ff;font:11px/1.3 var(--mono);letter-spacing:.1em}.road-checkin b{display:block;margin-top:2px;font-size:13px}.road-checkin-list{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.road-checkin-list::-webkit-scrollbar{display:none}
.road-checkin-list button{flex:none;display:flex;align-items:center;gap:4px;min-height:38px;padding:5px 9px;border:1px solid #35446a;border-radius:9px;color:#dbe5fb;background:#121a2c;font-size:12px}.road-checkin-list button:disabled{opacity:.55}
.save-backup>p{margin:0 0 9px;color:#aeb7c7;font-size:12px;line-height:1.48}.save-backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.save-backup-actions button,.save-backup-actions label{display:grid;place-items:center;min-height:44px;padding:7px;border:1px solid #394767;border-radius:9px;color:#d7e4ff;background:#12192a;font-size:12px;text-align:center}.save-backup-actions label{border-color:rgba(255,180,84,.38);color:#f2cf9b;background:#241d1a;cursor:pointer}.save-backup-actions input{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0}
.knowledge-status h4 small{color:var(--faded);font-weight:400}

.route-rumor-grid{display:grid;gap:7px}.route-rumor-grid article{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:9px 10px;

.route-rumor-grid small{color:#8793aa;font:12px/1.4 var(--mono)}.route-rumor-reward{margin-top:3px;color:#b9c4d4!important}

.route-copy{min-width:0}.route-name{display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ── dock ── */
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;background:linear-gradient(180deg,rgba(13,17,29,.91),rgba(7,10,18,.98));
  border-top:1px solid rgba(255,180,84,.16);backdrop-filter:blur(10px);
  padding-bottom:var(--safe-bottom);z-index:10}
#dock button{flex:1;padding:9px 0 8px;font-size:12.5px;color:#a5aec5;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;letter-spacing:.04em;min-height:49px}
#dock button .dic{font-size:16px;line-height:1;filter:saturate(.72)}
#dock button.here{color:var(--amber);box-shadow:inset 0 2px var(--amber)}
#dock button:disabled{opacity:.35}

/* ── modal sheet (event) ── */
.sheet-wrap{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;justify-content:flex-end;
  background:rgba(4,6,12,.6)}
.sheet-wrap.on{display:flex}
.sheet{background:linear-gradient(#161c30,var(--panel2));border-top:1px solid #2c3660;
  border-radius:16px 16px 0 0;padding:18px 18px calc(18px + var(--safe-bottom));
  max-height:88%;overflow-y:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet.event-mode{display:flex;flex-direction:column;overflow:hidden;padding:0;
  height:calc(100dvh - max(12px,var(--safe-top)));max-height:calc(100dvh - max(12px,var(--safe-top)));
  touch-action:pan-y;overscroll-behavior:contain}
/* 짧은 대사에서도 진행 조작은 화면 아래 같은 자리를 지킨다. */
.sheet.event-mode.story-compact{justify-content:stretch}
.sheet.event-mode.story-compact .event-scroll{flex:1 1 auto;max-height:none}
.ait-runtime .sheet.event-mode{
  height:calc(100dvh - var(--safe-top) - 70px);
  max-height:calc(100dvh - var(--safe-top) - 70px)}
.event-scroll{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 8px;touch-action:pan-y;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
  scrollbar-color:var(--line) transparent}
.event-choice-dock{flex:none;min-height:0;overflow:hidden;padding:8px 14px calc(8px + var(--safe-bottom));
  border-top:1px solid #2c3657;background:#0d111e;
  box-shadow:0 -10px 24px rgba(4,6,12,.42)}
.choice-dock-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;
  margin-bottom:6px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--amber-dim)}
.choice-dock-head small{font-size:12px;letter-spacing:0;color:#929bb4}
.story-progress-dock{min-height:108px}
.story-auto-toggle{flex:none;min-width:78px;min-height:44px;margin:-8px 0;padding:6px 10px;
  border:1px solid #39456f;border-radius:22px;color:#aeb7ce;background:rgba(255,255,255,.025);
  font:12px/1 var(--mono);letter-spacing:.04em}
.story-auto-toggle.on{color:var(--cheollian);border-color:rgba(85,224,200,.42);
  background:rgba(85,224,200,.055)}
.story-auto-toggle.waiting{color:#f0c783;border-color:rgba(240,199,131,.42);
  background:rgba(240,199,131,.06)}
.story-combat-toggle{flex:none;min-width:78px;min-height:44px;margin:-8px 0 0;padding:6px 10px;
  border:1px solid #39456f;border-radius:22px;color:#aeb7ce;background:rgba(255,255,255,.025);
  font:12px/1 var(--mono);letter-spacing:.04em}
.story-combat-toggle.on{color:var(--amber);border-color:rgba(255,180,84,.42);
  background:rgba(255,180,84,.055)}
.story-progress-dock .story-next{min-height:61px;display:flex;flex-direction:column;justify-content:center}
.event-choice-dock>.choices{max-height:min(40dvh,360px);overflow-y:auto;padding:1px 2px 8px;scroll-padding-block:8px;
  touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;
  scrollbar-color:var(--line) transparent}
/* 선택 카드는 절대 줄어들지 않는다. flex-shrink를 허용하면 목록이 스크롤되는 대신
   카드가 눌려서 overflow:hidden에 잘린다 — 실패 비용·요구 조건이 통째로 사라진다. */
.event-choice-dock>.choices>.choice{flex:none}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet,#app.combat-hit,#app.combat-alert,.combat-hud.combat-result-success,.combat-hud.combat-result-partial,.combat-hud.combat-result-failure{animation:none}.bubble{transition:none}}
.sheet .tag{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--amber-dim);margin-bottom:6px}
.event-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
.event-head>div{min-width:0;flex:1}.event-head h2{margin-bottom:0}
.event-portrait{flex:none;width:52px;height:52px;border-radius:11px;object-fit:cover;image-rendering:pixelated;
  border:1px solid #39456f;background:#0a0d18}
.event-scene-frame{position:relative;margin:-18px -18px 14px;width:calc(100% + 36px);overflow:hidden;
  border-bottom:1px solid #39456f;background:#080b13;aspect-ratio:16/9;max-height:270px;cursor:zoom-in}
.event-scene-frame:after{content:"";position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(180deg,rgba(5,7,13,.02) 52%,rgba(8,11,19,.62)),
  repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
.event-scene-frame[data-scene-format="character"]:after{background:linear-gradient(90deg,rgba(5,7,13,.22),transparent 30% 70%,rgba(5,7,13,.22)),linear-gradient(180deg,transparent 48%,rgba(8,11,19,.66))}
.event-scene-frame[data-scene-format="detail"]:after{background:linear-gradient(180deg,rgba(5,7,13,.06),rgba(8,11,19,.7)),repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px)}
.event-scene-frame[data-scene-format="action"]:after{background:linear-gradient(115deg,rgba(5,7,13,.2),transparent 42%),linear-gradient(180deg,transparent 48%,rgba(8,11,19,.7))}
.event-scene{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto;
  object-position:var(--scene-x,50%) var(--scene-y,50%);
  transform:scale(var(--scene-scale,1));transform-origin:var(--scene-x,50%) var(--scene-y,50%);
  filter:brightness(var(--scene-brightness,1)) saturate(var(--scene-saturation,1));
  transition:object-position .42s ease,transform .52s cubic-bezier(.2,.8,.2,1),filter .42s ease;
  animation:scene-reveal .65s cubic-bezier(.2,.8,.2,1) both}
.event-scene.scene-recut{animation:scene-recut .48s cubic-bezier(.2,.8,.2,1) both}
.event-scene-frame[data-tone="ai"]{--scene-brightness:.9;--scene-saturation:.72}
.event-scene-frame[data-tone="memory"]{--scene-brightness:.92;--scene-saturation:.78}
.event-scene-frame[data-tone="outcome"]{--scene-brightness:.94;--scene-saturation:1.08}
.scene-cut-mark{position:absolute;left:9px;bottom:8px;z-index:2;padding:3px 7px;border-radius:8px;
  background:rgba(5,8,15,.62);border:1px solid rgba(255,255,255,.14);
  color:rgba(232,227,213,.88);font:12px/1.35 var(--mono);letter-spacing:.08em;pointer-events:none}
.scene-zoom{position:absolute;right:9px;top:9px;z-index:2;width:27px;height:27px;border-radius:50%;
  display:grid;place-items:center;background:rgba(5,8,15,.72);border:1px solid rgba(255,255,255,.2);
  color:#e4e8f2;font-size:13px;pointer-events:none}
.event-scene-frame.zoomed{position:fixed;inset:0;z-index:80;margin:0;width:auto;max-height:none;
  aspect-ratio:auto;border:0;background:rgba(2,4,9,.97);cursor:zoom-out}
.event-scene-frame.zoomed:after{display:none}
.event-scene-frame.zoomed .event-scene{object-fit:contain;object-position:center;transform:none;filter:none;animation:none}
.event-scene-frame.zoomed .scene-zoom{right:16px;top:16px}
.ait-runtime .event-scene-frame.zoomed .scene-zoom{
  right:calc(var(--safe-right) + 16px);top:calc(var(--safe-top) + 56px)}
@keyframes scene-reveal{
  from{opacity:0;transform:scale(calc(var(--scene-scale,1) + .035))}
  to{opacity:1;transform:scale(var(--scene-scale,1))}
}
@keyframes scene-recut{
  from{opacity:.38;transform:scale(calc(var(--scene-scale,1) + .045))}
  to{opacity:1;transform:scale(var(--scene-scale,1))}
}
@media(prefers-reduced-motion:reduce){
  .event-scene,.event-scene.scene-recut{animation:none;transition:none}
}
.sheet .tag.ai-tag{color:var(--cheollian)}
.sheet h2{font-size:17px;line-height:1.35;margin-bottom:10px;text-wrap:balance}

.story-context{margin:-2px 0 12px;padding:8px 10px;border-left:2px solid rgba(85,224,200,.58);

.combat-track{display:flex;gap:4px;padding:0 10px 8px}.combat-track i{height:3px;flex:1;border-radius:3px;background:#272c3c}

.combat-intent b,.combat-read b{font:12px/1.35 var(--mono);letter-spacing:.09em;color:#ff938c;white-space:nowrap}

.combat-debrief-grid .gain{color:#bce8c7}.combat-debrief-grid .cost{color:#f0c3bd}
.combat-debrief-grid .combat-cause{grid-column:1 / -1;color:#dde5ee}
.combat-recovery{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.07);color:#aeb7c9;font:12px/1.35 var(--mono)}
.combat-state{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 9px}
.combat-state span,.combat-tactic{font:12px var(--mono);padding:2px 7px;border:1px solid var(--line);
  border-radius:10px;color:var(--faded);background:rgba(6,9,16,.48)}
.combat-state .good{color:var(--ok);border-color:rgba(125,201,143,.34)}
.combat-state .bad{color:#ff938c;border-color:rgba(226,87,79,.38)}
.combat-tactic{display:inline-block;margin-right:7px;color:var(--amber);border-color:rgba(255,180,84,.28)}
.combat-difficulty{display:flex;flex-wrap:wrap;gap:5px;padding:2px 10px 8px}
.combat-forecast{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:5px 8px;margin:1px 10px 8px;padding:7px 8px;border:1px solid rgba(255,255,255,.075);border-radius:8px;background:rgba(9,13,22,.5);font:12px/1.35 var(--mono);color:#aeb7c9}
.combat-forecast strong{grid-column:2;color:#eef1f4;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combat-phase-summary{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:0 10px 6px}
.combat-phase-summary b{font:12px var(--mono);letter-spacing:.08em;color:var(--amber-dim);margin-right:4px}
.combat-phase-summary .combat-phase-chip{display:inline-flex;align-items:center;padding:2px 6px;border-radius:999px;border:1px solid var(--line);
  color:var(--faded);background:rgba(6,9,16,.38)}
.combat-phase-summary .combat-phase-chip.good{color:var(--ok);border-color:rgba(125,201,143,.34)}
.combat-phase-summary .combat-phase-chip.neutral{color:var(--cheollian);border-color:rgba(255,180,84,.34)}
.combat-phase-summary .combat-phase-chip.hard{color:#ff938c;border-color:rgba(226,87,79,.38)}
.combat-phase-summary .combat-phase-chip.jump{color:#f5c36a;border-color:rgba(255,180,84,.56);font-weight:600}
.combat-phase-summary .combat-phase-chip.jump{animation:combat-phase-jump 2.4s ease-in-out infinite}
.combat-phase-summary .combat-phase-chip.on{box-shadow:inset 0 0 0 1px currentColor}
.combat-difficulty-compact .combat-phase-chip{font-size:12px}
.combat-difficulty-compact .combat-tier{font-size:12px}
.combat-tier{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;border:1px solid var(--line);
  color:var(--faded);background:rgba(6,9,16,.38)}
.combat-tier.good{color:var(--ok);border-color:rgba(125,201,143,.34)}
.combat-tier.neutral{color:var(--cheollian);border-color:rgba(255,180,84,.34)}
.combat-tier.hard{color:#ff938c;border-color:rgba(226,87,79,.38)}
.choice .combat-response{display:block;margin-top:5px;color:var(--ok);font:12px/1.35 var(--mono)}
.choice .combat-odds{display:block;margin-top:4px;font:12px var(--mono);color:var(--faded)}
.choice .route-forecast{display:block;margin-top:7px;padding:7px 8px;border-left:2px solid var(--amber-dim);
  background:rgba(255,180,84,.055);color:#d7d0c5}
.choice .route-forecast b{display:block;font:12px/1.35 var(--mono);color:var(--amber)}
.choice .route-forecast small{display:block;margin-top:2px;color:#aeb7c8;font:12px/1.4 var(--mono)}
#app.combat-hit{animation:combat-hit .32s ease-out}#app.combat-alert{animation:combat-alert .45s ease-out}
@keyframes combat-hit{20%{transform:translateX(-4px);filter:brightness(1.22) sepia(.22)}45%{transform:translateX(3px)}to{transform:none;filter:none}}
@keyframes combat-alert{35%{box-shadow:inset 0 0 70px rgba(226,87,79,.2)}to{box-shadow:none}}
@keyframes combat-result-success{0%{box-shadow:inset 0 0 60px rgba(125,201,143,.24);transform:translateY(3px)}to{box-shadow:none;transform:none}}
@keyframes combat-result-partial{0%{box-shadow:inset 0 0 60px rgba(255,180,84,.22);transform:translateY(3px)}to{box-shadow:none;transform:none}}
@keyframes combat-result-failure{18%{transform:translateX(-3px);box-shadow:inset 0 0 70px rgba(226,87,79,.25)}45%{transform:translateX(2px)}to{transform:none;box-shadow:none}}
@keyframes combat-phase-jump{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.22)}
}
.sheet .body .ai-voice, .sheet .body .ai, .outcome .ai{color:var(--cheollian);font-family:var(--mono);font-size:12.5px}
.story-reader{min-height:112px;display:flex;align-items:stretch}
.story-turn{width:100%;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.025);
  padding:13px 14px;display:flex;flex-direction:column;justify-content:center;gap:10px;
  transition:opacity .18s ease,transform .18s ease}
.story-turn.turn-enter,.story-narration.turn-enter{opacity:.28;transform:translateY(4px)}
.turn-speaker{display:flex;align-items:center;gap:10px}
.turn-avatar{flex:none;width:48px;height:48px;border-radius:11px;object-fit:cover;image-rendering:pixelated;
  border:1px solid #39456f;background:#0a0d18}
.turn-speaker span{min-width:0}.turn-speaker small,.turn-source{display:block;color:var(--faded);
  font:12px/1.35 var(--mono);letter-spacing:.14em;text-transform:uppercase}
.turn-speaker b{display:block;margin-top:2px;color:var(--amber);font-size:14px}
.turn-text{color:#d8dbe4;font-size:14px;line-height:1.68;white-space:pre-wrap;word-break:keep-all}
.story-turn.narration{border-left:2px solid rgba(232,227,213,.38);background:rgba(8,11,19,.54)}
.story-turn.narration .turn-text{font-family:var(--serif);color:#c9ccd4}
.story-turn.ai{border-color:rgba(85,224,200,.42);background:rgba(85,224,200,.045)}
.story-turn.ai .turn-source,.story-turn.ai .turn-text{color:var(--cheollian);font-family:var(--mono)}
.story-turn.thought{border-color:rgba(255,180,84,.25);background:rgba(255,180,84,.035)}
.story-turn.thought .turn-text{font-family:var(--serif);font-style:italic;color:#ddd2bf}
.story-turn.letter{border-color:rgba(255,180,84,.28);background:linear-gradient(145deg,rgba(255,180,84,.06),rgba(255,255,255,.02))}
.story-turn.letter .turn-text{font-family:var(--serif)}
.story-turn.record{border-style:dashed}.story-turn.record .turn-source{color:var(--amber-dim)}
.story-turn.identity-hidden .turn-speaker b{color:var(--faded);letter-spacing:.16em}
.story-chat{width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:9px;padding:5px 0}
.story-transcript{justify-content:flex-start;align-self:stretch;display:flex;flex-direction:column;gap:8px}
.story-transcript .story-turn{min-height:0;flex:none}
.story-narration{width:100%;align-self:stretch;padding:11px 14px 12px;border-top:1px solid rgba(232,227,213,.2);
  border-bottom:1px solid rgba(232,227,213,.2);background:rgba(8,11,19,.66);
  transition:opacity .18s ease,transform .18s ease}
.story-narration-label{display:block;margin-bottom:5px;color:#949bad;text-align:center;
  font:12px/1.3 var(--mono);letter-spacing:.2em}
.story-narration-text{width:100%;color:#d0d3db;font:13.5px/1.7 var(--serif);
  white-space:pre-wrap;word-break:keep-all;text-align:left}
.chat-msg{display:flex;align-items:flex-start;gap:8px;width:100%;transition:opacity .18s ease,transform .18s ease}
.chat-msg.side-right{flex-direction:row-reverse}
.chat-msg.turn-enter{opacity:.2;transform:translateY(5px)}
.chat-avatar{flex:none;width:40px;height:40px;border-radius:11px;object-fit:cover;image-rendering:pixelated;
  border:1px solid #39456f;background:#0a0d18}
.chat-copy{display:flex;flex-direction:column;align-items:flex-start;min-width:0;max-width:min(78%,400px)}
.chat-msg.side-right .chat-copy{align-items:flex-end}
.chat-name{margin:0 2px 4px;color:var(--amber);font:700 12px/1.25 var(--mono)}
.chat-msg.identity-hidden .chat-name{color:var(--faded);letter-spacing:.16em}
.chat-msg.side-right .chat-name{align-self:flex-end}
.chat-bubble{padding:9px 11px;border:1px solid #303956;border-radius:4px 13px 13px 13px;
  background:#171d2e;color:#d8dbe4;font-size:13.5px;line-height:1.58;white-space:pre-wrap;word-break:keep-all}
.chat-msg.chat-newest .chat-bubble{box-shadow:0 0 0 1px rgba(255,180,84,.08),0 12px 18px rgba(4,6,12,.24)}
.chat-msg.chat-newest .chat-name{color:#ffd59f}
.chat-msg.side-right .chat-bubble{border-color:rgba(102,130,188,.34);border-radius:13px 4px 13px 13px;
  background:rgba(63,79,119,.22)}
.chat-msg.mine .chat-bubble{border-color:rgba(255,180,84,.28);
  background:rgba(255,180,84,.105);color:#eee7da}
.story-next{width:100%;border-color:var(--amber-dim);background:rgba(255,180,84,.07);text-align:center}
.story-result{margin-top:10px}.story-result .fx-line{margin-bottom:0}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{position:relative;isolation:isolate;overflow:hidden;text-align:left;min-height:48px;background:#141a28;border:1px solid var(--line);border-radius:10px;
  padding:11px 13px;font-size:13.5px;line-height:1.4;overflow-wrap:anywhere;transition:border-color .15s}
.choice-head{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.choice-index{flex:none;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;
  font:700 12px/1 var(--mono);color:#fff;background:rgba(255,180,84,.2);border:1px solid rgba(255,180,84,.4)}
.choice-title{display:flex;min-width:0;flex-direction:column;gap:2px;font-size:14px;line-height:1.4}
.choice-title .combat-tactic{display:block;color:var(--cheollian);font:700 12px/1.3 var(--mono);margin-bottom:2px}
.choice:hover{border-color:var(--amber-dim)}
.choice:active{background:rgba(255,180,84,.06)}
.choice .req{display:block;font-family:var(--mono);font-size:12px;color:var(--cheollian);margin-top:3px}
.choice .risk{color:var(--faded);font-family:var(--mono);font-size:12px;margin-left:6px}
.combat-choice-hint{display:flex;flex-wrap:wrap;gap:4px 8px;padding:6px 10px;border:1px solid rgba(255,180,84,.28);border-radius:10px;
  background:rgba(255,180,84,.08);color:var(--faded);margin:0 0 8px;font:12px/1.35 var(--mono)}
.combat-choice-hint span{color:#d7dbe6}
.choice .combat-risk{display:inline-block;margin-top:4px;margin-right:6px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);
  color:var(--faded);background:rgba(6,9,16,.38);font:12px/1.35 var(--mono)}
.choice .combat-risk.combat-risk-combat-safe{color:var(--ok);border-color:rgba(125,201,143,.34)}
.choice .combat-risk.combat-risk-combat-hint{color:#c2cdde;border-color:rgba(85,224,200,.34)}
.choice .combat-risk.combat-risk-combat-warning{color:#f5c36a;border-color:rgba(255,180,84,.5)}
.choice .combat-risk.combat-risk-combat-critical{color:#ff938c;border-color:rgba(226,87,79,.62);font-weight:700}
.choice .combat-failure{display:block;margin-top:5px;padding:5px 7px;border-left:2px solid rgba(226,87,79,.78);
  background:rgba(226,87,79,.075);color:#f2b6b0;font:12px/1.4 var(--mono)}
.choice[disabled]{opacity:.4}
.choice[disabled] .req{color:var(--danger)}
.outcome{border-left:2px solid var(--amber-dim);padding:2px 0 2px 12px;margin:4px 0 14px;
  color:#d8dbe4;font-size:14px;white-space:pre-wrap}
.fx-line{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fx{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);
  background:var(--panel)}
.fx.plus{color:var(--ok);border-color:rgba(125,201,143,.4)}
.fx.minus{color:var(--danger);border-color:rgba(226,87,79,.4)}
.fx.item{color:var(--amber)}

/* ── 도시 첫인상 시네마틱 ── */
#arrival-scene{position:absolute;inset:0;z-index:29;display:flex;align-items:flex-end;overflow:hidden;
  background:#070a12;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .35s ease}
#arrival-scene.on{opacity:1;visibility:visible;pointer-events:auto}
#arrival-scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto;
  transform:scale(1.025);transition:transform 2.8s ease-out}
.arrival-fallback{position:absolute;inset:0;background:
  radial-gradient(75% 48% at 50% 30%,rgba(255,180,84,.16),transparent 72%),
  linear-gradient(165deg,#151c2d 0%,#090d17 56%,#04060b 100%)}
#arrival-scene.on img{transform:scale(1)}
#arrival-scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(4,6,12,.92));pointer-events:none}
.arrival-copy{position:relative;z-index:1;width:100%;padding:28px 20px calc(26px + var(--safe-bottom));
  text-shadow:0 2px 12px #000;animation:up .45s .18s both}
.arrival-copy small{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--amber);margin-bottom:6px}
.arrival-copy b{display:block;font-size:22px;line-height:1.2;margin-bottom:7px}
.arrival-copy span{display:block;max-width:620px;color:#d0d4dc;font-size:13px;line-height:1.55}
.arrival-ledger{max-width:620px;margin-top:13px;padding:10px 11px;border:1px solid rgba(255,255,255,.2);border-radius:10px;
  background:rgba(4,7,13,.68);backdrop-filter:blur(6px);text-shadow:none}
.arrival-ledger>div:first-child{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.arrival-ledger strong{font-size:12.5px;color:#fff}.arrival-ledger em{color:#c3cbd8;font:12px/1.35 var(--mono);font-style:normal;text-align:right}
.arrival-deltas{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.arrival-deltas i{padding:3px 7px;border:1px solid rgba(255,255,255,.15);border-radius:999px;color:#d7dce6;
  font:12px/1.25 var(--mono);font-style:normal}
.arrival-deltas i.gain{color:#aee8bf;border-color:rgba(125,201,143,.38);background:rgba(52,112,73,.18)}
.arrival-deltas i.cost{color:#ffaaa3;border-color:rgba(226,87,79,.4);background:rgba(117,44,41,.18)}
.arrival-contract{margin-top:7px;padding-top:7px;border-top:1px dashed rgba(255,180,84,.2);color:#c7cedc;line-height:1.45;font:12px/1.45 var(--serif)}
.arrival-contract small{display:block;margin-bottom:2px;color:var(--amber);font:12px/1.3 var(--mono)}
.arrival-contract strong{display:block;font:12px/1.45 var(--serif);color:#dfe5ef}
.arrival-contract span{display:block;margin-top:3px;color:#b6becd}
.arrival-people,.arrival-chapter{margin-top:7px;padding:7px 8px;border-left:2px solid rgba(125,201,143,.55);background:rgba(31,69,48,.2)}
.arrival-people small,.arrival-chapter small{margin:0;color:#9fd3ad;font:10px/1.3 var(--mono);letter-spacing:.08em}.arrival-people strong,.arrival-chapter strong{display:block;margin-top:2px;color:#edf4ef;font:12px/1.4 var(--serif)}
.arrival-people span,.arrival-chapter span{display:block;margin-top:2px;color:#bfc9c2;font:11px/1.4 var(--serif)}
.arrival-chapter{border-left-color:var(--amber);background:rgba(127,83,30,.22)}.arrival-chapter small{color:var(--amber)}
.arrival-ledger p{margin:7px 0 0;color:#e6c38c;font:12px/1.4 var(--mono)}
@media(max-height:720px){.arrival-copy{padding-bottom:calc(16px + var(--safe-bottom))}.arrival-copy>span{display:none}.arrival-ledger{margin-top:8px}}

/* ── overlays: map / journal ── */
.ovl{position:absolute;inset:0;background:var(--night);z-index:25;display:none;flex-direction:column}
.ovl.on{display:flex}
.ovl-head{flex:none;display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.ait-runtime .ovl-head{padding-top:calc(var(--safe-top) + 56px);
  padding-right:calc(var(--safe-right) + 14px);padding-left:calc(var(--safe-left) + 14px)}
.ovl-head h2{font-size:15px;letter-spacing:.02em;flex:1}
.ovl-head .x{color:var(--faded);font-size:20px;min-width:44px;min-height:44px;padding:2px 8px;
  display:grid;place-items:center}
.ovl-head .mini{font-family:var(--mono);font-size:12px;color:var(--dim)}
.map-mission{border-bottom:0}
#mapwrap{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(100% 80% at 50% 20%,#0e1326,#090b16)}
#mapcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#nodecard{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(15,20,34,.96);
  z-index:4;border:1px solid #2c3660;border-radius:12px;padding:12px 14px;display:none;backdrop-filter:blur(6px)}
#nodecard.on{display:block}
#nodecard h4{font-size:14.5px}
#nodecard .d{color:var(--faded);font-size:12px;margin:3px 0 9px}
.map-route-preview{margin:8px 0 2px;padding:8px 9px;border-left:2px solid var(--cheollian);background:rgba(85,224,200,.055)}
.map-route-preview b{display:block;color:var(--cheollian);font:12px/1.35 var(--mono)}
.map-route-preview span{display:block;margin-top:3px;color:#b9c3d5;font-size:12px;line-height:1.45}
#nodecard .go{width:100%;background:linear-gradient(rgba(255,180,84,.14),rgba(255,180,84,.05));

#nodecard .go[disabled]{opacity:.4}
#nodecard .go small{display:block;font-weight:400;font-family:var(--mono);font-size:12px;color:var(--faded);margin-top:2px}
/* status */
#st-body{flex:1;overflow-y:auto;padding:12px 14px calc(18px + var(--safe-bottom))}
.st-tabs{flex:none;display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);background:#0d1120}
.st-tabs button{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 5px;
  color:var(--faded);font-size:12px;background:var(--panel2);min-height:44px}
.st-tabs button.here{color:var(--amber);border-color:var(--amber-dim);background:var(--amber-glow)}
.st-pane{display:none}.st-pane.on{display:block}
.st-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
.st-metric{min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--panel)}
.st-metric .mk{display:block;color:#aeb5c8;font-family:var(--mono);font-size:12px;letter-spacing:.06em}
.st-metric .mv{display:block;margin-top:2px;color:var(--paper);font-family:var(--mono);
  font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-metric.warn{border-color:rgba(226,87,79,.52)}.st-metric.warn .mv{color:var(--danger)}
.st-sec{margin-bottom:11px;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:var(--panel2)}
.st-sec h4{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--amber-dim);margin-bottom:8px}
.st-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.st-row:last-child{border-bottom:none}
.st-row .k{color:#aeb5c8;flex:none;width:88px;font-size:12.5px}
.st-row .v{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.st-row .bar{flex:1;height:4px;background:#0a0d18;border-radius:2px;overflow:hidden}
.st-row .bar i{display:block;height:100%;background:var(--amber);border-radius:2px}
.st-more{margin:-2px 0 10px;text-align:center;color:#9fa8bd;font:12px/1.45 var(--mono)}
.st-more span{color:var(--amber)}
.quality-panel{padding:0;overflow:hidden}
.quality-panel summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px;padding:10px 12px;cursor:pointer;color:var(--amber);font:12px/1.35 var(--mono);list-style-position:inside}
.quality-panel summary small{color:var(--faded);font-size:12px;text-align:right}
.quality-panel[open] summary{border-bottom:1px solid var(--line);background:rgba(255,180,84,.035)}
.quality-panel>div:not(.quality-metrics){margin-left:11px;margin-right:11px}
.quality-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:10px 11px 5px}
.quality-metrics span{min-width:0;padding:7px 5px;border:1px solid var(--line);border-radius:8px;background:rgba(6,9,16,.38);text-align:center}
.quality-metrics b{display:block;color:var(--paper);font:13px/1.2 var(--mono)}
.quality-metrics small{display:block;margin-top:3px;color:var(--faded);font:12px/1.25 var(--mono)}
.quality-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px 0 11px}

.upchips{display:flex;flex-wrap:wrap;gap:6px}
.upchip{font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--amber-dim);

/* journal */
#jtabs{flex:none;display:flex;border-bottom:1px solid var(--line)}
#jtabs button{flex:1;padding:9px 0;font-size:12.5px;color:var(--faded);border-bottom:2px solid transparent}

.jpane{flex:1;overflow-y:auto;display:none;padding:14px 16px}
.jpane.on{display:block}

#jgraphwrap.on{display:block}
#graphcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.jchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
/* ── 서울 오르막 맵 ── */
#ovl-seoul{background:linear-gradient(180deg,#0a0d1c 0%,#141020 55%,#1c1420 100%)}
#seoul-body{flex:1;overflow-y:auto;padding:8px 18px 24px;position:relative}
.seoul-asc{position:relative;max-width:340px;margin:0 auto;padding:12px 0}
.seoul-road{position:absolute;left:26px;top:24px;bottom:24px;width:2px;
  background:linear-gradient(180deg,rgba(85,224,200,.5),rgba(255,180,84,.35))}
.seoul-stop{position:relative;display:flex;gap:14px;align-items:flex-start;padding:14px 0;min-height:58px}
.seoul-stop .dot{position:relative;z-index:2;flex:none;width:14px;height:14px;margin-left:20px;border-radius:50%;
  background:var(--night);border:2px solid var(--dim);margin-top:3px}
.seoul-stop.done .dot{background:var(--amber);border-color:var(--amber)}
.seoul-stop.here .dot{border-color:var(--cheollian);box-shadow:0 0 0 4px rgba(85,224,200,.18);animation:seoulpulse 1.8s infinite}
@keyframes seoulpulse{50%{box-shadow:0 0 0 8px rgba(85,224,200,.05)}}
.seoul-stop .txt b{font-size:14.5px;display:block}
.seoul-stop.here .txt b{color:var(--cheollian)}
.seoul-stop.done .txt b{color:var(--amber)}
.seoul-stop .txt small{display:block;color:var(--faded);font-size:12px;margin-top:2px;line-height:1.45}
.seoul-stop.locked{opacity:.4}
.seoul-cta{display:flex;flex-direction:column;gap:9px;max-width:340px;margin:6px auto 0}
.seoul-cta .act{justify-content:center}
.seoul-journey-load{display:grid;gap:5px;max-width:340px;margin:12px auto;padding:11px 12px;border:1px solid rgba(85,224,200,.26);border-radius:11px;
  background:linear-gradient(135deg,rgba(85,224,200,.08),rgba(13,18,31,.82))}
.seoul-journey-load>small{color:var(--cheollian);font:700 11px/1.3 var(--mono);letter-spacing:.14em}
.seoul-journey-load>b{font-size:14px;color:#edf4f1}.seoul-journey-load>div{display:grid;grid-template-columns:42px minmax(0,1fr);gap:7px;font-size:12px;line-height:1.4}
.seoul-journey-load span{color:#8fa0af;font-family:var(--mono)}.seoul-journey-load strong{color:#d5dfdf;font-weight:500}
.seoul-memory-recap{display:grid;gap:5px;padding:10px 11px;border:1px solid rgba(255,180,84,.28);border-radius:10px;background:rgba(255,180,84,.045)}
.seoul-memory-recap>b{color:var(--amber);font:12px/1.35 var(--mono);letter-spacing:.08em}.seoul-memory-recap>span{color:#cbd0dc;font-size:12px;line-height:1.45}
#seoul-tower{text-align:center;font-size:12px;color:var(--faded);font-family:var(--mono);margin:2px 0 10px;letter-spacing:.12em}
.jchip{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--faded);
  background:none;border:1px solid var(--line);border-radius:20px;padding:3px 10px;cursor:pointer}
.jchip small{opacity:.55;margin-left:2px}
.jchip.here{color:var(--amber);border-color:var(--amber-dim)}
.note{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:var(--panel)}
.note .nh{display:flex;gap:7px;align-items:baseline;margin-bottom:3px}
.note .nt{font-family:var(--mono);font-size:12px;letter-spacing:.08em;padding:1px 6px;border-radius:4px;
  border:1px solid var(--line);color:var(--faded)}
.note .nt.인물{color:#e8a0bf;border-color:#5d3c4d}.note .nt.장소{color:#8fc7ff;border-color:#33507a}
.note .nt.사건{color:var(--amber);border-color:#6b5527}.note .nt.소문{color:#c9b8ff;border-color:#4d4370}
.note b{font-size:13.5px}
.note .nd{font-family:var(--mono);font-size:12px;color:var(--dim);margin-left:auto}
.note p{font-family:var(--serif);font-size:13px;color:#cdd1dd;line-height:1.6}
.note .links{margin-top:5px}
.note .lk{font-family:var(--mono);font-size:12px;color:var(--cheollian);margin-right:8px}
#gnote{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(15,20,34,.97);
  border:1px solid #2c3660;border-radius:12px;padding:11px 13px;display:none;max-height:45%;overflow-y:auto}
#gnote.on{display:block}

/* ── title screen ── */
#scr-title{justify-content:flex-end;background:#000}
#titlecv{position:absolute;inset:0;width:100%;height:100%}
#title-ui{position:relative;padding:0 26px calc(34px + var(--safe-bottom));z-index:2}
#title-ui .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.34em;color:var(--faded);margin-bottom:8px}
#title-ui h1{font-size:44px;line-height:1.06;letter-spacing:-.03em;font-weight:800;text-wrap:balance}
#title-ui h1 .km{font-family:var(--mono);color:var(--amber);font-weight:700}
#title-ui .tag{color:var(--faded);font-size:13px;margin:10px 0 26px}
#title-ui .acts{gap:9px}
#last-journey{margin-top:10px;padding:8px 10px;border-left:2px solid var(--cheollian);border-radius:0 8px 8px 0;
  background:rgba(7,18,25,.72)}
#last-journey>span,#last-journey>b,#last-journey>small{display:block}

/* ── journey preview / 실제 게임 삽화 앨범 ── */
#scr-preview{background:
  radial-gradient(100% 45% at 50% 0%,rgba(255,180,84,.09),transparent 72%),#090c15;
  overflow:hidden}
#preview-head{flex:none;display:flex;align-items:center;gap:12px;padding:
  calc(14px + var(--safe-top)) calc(16px + var(--safe-right)) 12px calc(16px + var(--safe-left));
  border-bottom:1px solid var(--line);background:rgba(9,12,21,.94);z-index:2}
#preview-head button{flex:none;width:40px;height:40px;border:1px solid #303a5d;border-radius:11px;
  background:var(--panel);color:var(--amber);font-size:21px}
#preview-head div{min-width:0}
#preview-head span{display:block;color:var(--amber-dim);font:12px/1.3 var(--mono);letter-spacing:.12em}
#preview-head h2{font-size:17px;line-height:1.35;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#preview-scroll{flex:1;min-height:0;overflow-y:auto;padding:15px calc(14px + var(--safe-right))
  calc(28px + var(--safe-bottom)) calc(14px + var(--safe-left));scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
.preview-lead{max-width:480px;margin:0 auto 14px;color:#b7bdcc;font:13px/1.65 var(--serif)}
#previous-journey{max-width:480px;margin:0 auto 14px;padding:13px;border:1px solid rgba(85,224,200,.3);border-radius:12px;
  background:linear-gradient(145deg,rgba(85,224,200,.08),rgba(15,20,34,.96))}
.previous-journey-head span,.previous-journey-head b{display:block}.previous-journey-head span{color:var(--cheollian);font:12px/1.3 var(--mono);letter-spacing:.12em}
.previous-journey-head b{margin-top:3px;font-size:15px}.previous-journey-facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.previous-journey-facts span{padding:3px 7px;border:1px solid #35415e;border-radius:999px;color:#c6cedd;font:12px/1.3 var(--mono)}
#previous-journey>p{margin:8px 0 0;color:#b9c2d0;font-size:12.5px;line-height:1.5}.next-road-rumor{margin-top:10px;padding-top:9px;border-top:1px dashed #334159}
.next-road-rumor small,.next-road-rumor b,.next-road-rumor span{display:block}.next-road-rumor small{color:var(--amber);font:12px/1.3 var(--mono)}
.next-road-rumor b{margin-top:2px;font-size:13px}.next-road-rumor span{margin-top:2px;color:#aeb8c8;font-size:12px;line-height:1.45}
#preview-grid{max-width:480px;margin:0 auto;display:grid;gap:13px}
.preview-card{position:relative;overflow:hidden;border:1px solid #293353;border-radius:14px;
  background:var(--panel);box-shadow:0 12px 30px rgba(0,0,0,.24)}
.preview-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#05070d}
.preview-card::after{content:"";position:absolute;left:0;right:0;top:0;aspect-ratio:16/9;
  pointer-events:none;background:linear-gradient(180deg,transparent 55%,rgba(8,10,17,.74))}
.preview-copy{position:relative;padding:11px 13px 13px}
.preview-copy .preview-no{position:absolute;right:12px;top:-26px;z-index:1;color:#fff;
  font:12px/1 var(--mono);letter-spacing:.08em;text-shadow:0 1px 5px #000}
.preview-copy .preview-kind{display:block;color:var(--amber);font:12px/1.35 var(--mono);
  letter-spacing:.14em;margin-bottom:3px}
.preview-copy h3{font-size:16px;line-height:1.4;margin-bottom:4px}
.preview-copy p{color:#aeb5c8;font-size:12.5px;line-height:1.55}
.preview-tail{max-width:480px;margin:20px auto 0;padding:18px 4px 2px;text-align:center;
  border-top:1px solid var(--line)}
.preview-tail>span{color:var(--amber-dim);font:12px/1.4 var(--mono);letter-spacing:.16em}
.preview-tail>p{color:var(--faded);font-size:12px;margin:5px 0 13px}
.preview-tail .act{width:100%;text-align:left}
@media(min-width:720px) and (min-height:700px){
  #preview-grid{grid-template-columns:1fr 1fr;max-width:520px}
  .preview-lead,.preview-tail,#previous-journey{max-width:520px}
}

/* ── mode select ── */
#scr-mode{padding:26px 22px;overflow-y:auto}
#scr-mode .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.3em;color:var(--faded);margin:14px 0 18px}
.mode-card{border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;text-align:left;
  width:100%;background:var(--panel);transition:border-color .2s;position:relative;overflow:hidden;
  cursor:pointer;box-sizing:border-box}
.mode-card:hover{border-color:#3a4671}
.mode-card .mk{font-family:var(--mono);font-size:12px;letter-spacing:.22em;margin-bottom:6px;color:var(--amber)}
.mode-card h2{font-size:19px;margin-bottom:5px}
.mode-card p{color:var(--faded);font-size:12.5px;line-height:1.55}
.mode-card .quote{margin-top:9px;font-size:12px;color:#cdd1dd;font-style:italic}
.mode-card.off .mk{color:var(--cheollian)}
.mode-card.off{background:linear-gradient(160deg,rgba(85,224,200,.05),var(--panel) 55%)}
.mode-card.locked{opacity:.85}
.mode-card .lock{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:9px;

/* ── name / intro ── */
#scr-name{display:none;align-items:center;justify-content:center;padding:22px;
  overflow-y:auto;background:radial-gradient(circle at 50% 20%,rgba(255,180,84,.1),transparent 42%),#05060c}

#name-card{width:min(100%,390px);padding:24px 22px 22px;text-align:center;border:1px solid #2b2e38;

#scr-intro{display:none;align-items:stretch;justify-content:stretch;padding:0;cursor:pointer;
  overflow:hidden;background:#05060c}
#scr-intro.on{display:flex}
#intro-skip{position:absolute;z-index:5;top:calc(10px + var(--safe-top));right:calc(10px + var(--safe-right));
  min-height:44px;padding:7px 12px;border:1px solid rgba(232,227,213,.35);border-radius:22px;
  background:rgba(5,6,12,.72);color:#e1e3e8;font:12px/1.3 var(--mono);backdrop-filter:blur(6px)}
#intro-summary{position:absolute;z-index:12;inset:0;display:none;align-items:center;justify-content:center;
  padding:calc(18px + var(--safe-top)) calc(14px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(14px + var(--safe-left));

.intro-summary-lead{margin:0 0 14px;color:#b7becd;font:13px/1.55 var(--sans)}
.intro-summary-card ol{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.intro-summary-card li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:9px;align-items:start;padding:9px;

.intro-summary-card li i{display:grid;place-items:center;width:32px;height:32px;border-right:1px solid rgba(255,180,84,.25);

.intro-summary-card li b{display:block;color:#e9e4da;font:700 13.5px/1.4 var(--serif)}

.intro-summary-actions{display:grid;grid-template-columns:1fr 1.15fr;gap:8px;margin-top:14px}

#intro-book{width:100%;height:100dvh;max-height:none;overflow:hidden;border:0;border-radius:0;background:#0b0c11;
  box-shadow:none;display:flex;flex-direction:column}
#intro-visual{position:relative;aspect-ratio:16/9;overflow:hidden;background:#05060c}
#intro-visual:after{content:"";position:absolute;inset:0;box-shadow:inset 0 -30px 44px rgba(5,6,12,.44)}
#intro-img{width:100%;height:100%;object-fit:cover;display:block}
#intro-page{padding:15px 18px calc(32px + var(--safe-bottom));max-height:none;min-height:0;
  overflow-y:auto;display:flex;flex:1;flex-direction:column}
#intro-meta{display:flex;justify-content:space-between;gap:12px;color:var(--amber-dim);
  font:12px/1.4 var(--mono);letter-spacing:.08em}
#intro-count{color:var(--dim)}
#intro-title{font:700 20px/1.35 var(--serif);margin:5px 0 8px;color:#f0eadc}

#intro-txt .chat-bubble{font-family:var(--serif);font-size:14px;line-height:1.62}

#intro-txt .em{color:var(--amber)}

}
#intro-auto{position:absolute;z-index:5;top:calc(10px + var(--safe-top));left:calc(10px + var(--safe-left));

  background:rgba(9,12,20,.82);color:var(--amber);font:12px/1 var(--mono);backdrop-filter:blur(6px)}

/* ── settlement ── */
#stl-head{position:relative;z-index:3;flex:none;padding:16px 16px 12px;border-bottom:1px solid var(--line);background:#0d1120}
.ait-runtime #stl-head{padding-top:calc(var(--safe-top) + 56px);
  padding-right:calc(var(--safe-right) + 16px);padding-left:calc(var(--safe-left) + 16px)}
#stl-head h2{display:flex;align-items:center;gap:8px;font-size:18px}
#stl-head h2>span{flex:1;min-width:0}
#stl-leave{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--faded);font-size:20px}
#stl-leave:hover,.stl-back:hover{color:var(--amber)}
.stl-back{flex:none;width:44px;height:44px;display:grid;place-items:center;margin:-8px 0 -8px -10px;
  color:var(--faded);font-size:30px;line-height:1}
#stl-head .d{color:var(--faded);font-size:12.5px;margin-top:3px}
#stl-body{flex:1;overflow-y:auto;padding:14px 16px calc(16px + var(--safe-bottom))}
#ovl-stl.hub-mode #stl-head{position:absolute;top:0;left:0;right:0;border-bottom:0;background:rgba(7,9,16,.78);

#ovl-stl.hub-mode #stl-head .d{display:none}
#ovl-stl.hub-mode #stl-body{padding:0;overflow:hidden}
.stl-hub{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0d18}
.stl-hub-art{position:absolute;inset:0;background-image:var(--stl-scene);background-position:center;background-size:cover;
  transform:scale(1.02)}
.stl-impact-layer{position:absolute;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.stl-impact-mark,.stl-impact-motion{position:absolute;display:block;opacity:0;transition:opacity .42s ease,transform .42s ease}
.stl-impact-mark{width:12px;height:7px;border-radius:3px;background:#ffc56f;
  box-shadow:0 0 8px 2px rgba(255,185,88,.7),22px 5px 0 -2px #ffe0a0,22px 5px 10px rgba(255,185,88,.5)}
.stl-impact-mark.mark-1{left:16%;top:34%;transform:translateY(5px)}
.stl-impact-mark.mark-2{right:18%;top:41%;transform:translateY(5px)}
.stl-impact-mark.mark-3{left:45%;top:27%;transform:translateY(5px)}
.stl-impact-motion{bottom:34%;width:10px;height:58px;border-left:3px solid rgba(239,240,222,.45);
  border-radius:50%;filter:blur(1px);transform:translateY(12px) rotate(7deg);animation:stl-impact-drift 3.2s ease-in-out infinite}
.stl-impact-motion.motion-1{left:24%}.stl-impact-motion.motion-2{right:27%;animation-delay:-1.2s}
.stl-impact-layer.stage-1 .mark-1,.stl-impact-layer.stage-1 .motion-1,
.stl-impact-layer.stage-2 .mark-1,.stl-impact-layer.stage-2 .mark-2,
.stl-impact-layer.stage-2 .motion-1,.stl-impact-layer.stage-3 .stl-impact-mark,
.stl-impact-layer.stage-3 .stl-impact-motion{opacity:1;transform:translateY(0) rotate(7deg)}
.stl-impact-layer.visual-water .stl-impact-mark,.stl-impact-layer.visual-air .stl-impact-mark{background:#9cdaf0;
  box-shadow:0 0 8px 2px rgba(117,204,238,.65),22px 5px 0 -2px #d8f2ff,22px 5px 10px rgba(117,204,238,.4)}
.stl-impact-layer.visual-water .stl-impact-motion{bottom:37%;width:54px;height:13px;border:2px solid rgba(123,215,241,.66);
  border-radius:50%;filter:none;transform:scale(.72);animation:stl-water-ripple 2.8s ease-out infinite}
.stl-impact-layer.visual-water .motion-1{left:13%}.stl-impact-layer.visual-water .motion-2{right:18%;left:auto;animation-delay:-1.3s}
.stl-impact-layer.visual-water.stage-1 .motion-1,.stl-impact-layer.visual-water.stage-2 .motion-1,
.stl-impact-layer.visual-water.stage-3 .stl-impact-motion{transform:scale(1)}
.stl-impact-layer.visual-steam .stl-impact-motion{border-left-color:rgba(255,245,219,.66);filter:blur(.5px)}
.stl-impact-layer.visual-record .stl-impact-mark,.stl-impact-layer.visual-watch .stl-impact-mark{background:#d8e6a1;
  box-shadow:0 0 8px 2px rgba(198,218,126,.6),22px 5px 0 -2px #f2f7d1,22px 5px 10px rgba(198,218,126,.36)}
.stl-impact-layer.visual-route .stl-impact-motion,.stl-impact-layer.visual-gate .stl-impact-motion,
.stl-impact-layer.visual-order .stl-impact-motion{height:2px;width:84px;border:0;border-top:2px dashed rgba(255,206,117,.66);filter:none}
@keyframes stl-impact-drift{50%{margin-bottom:10px;opacity:.55}}
@keyframes stl-water-ripple{70%,100%{transform:scale(1.28);opacity:0}}
.stl-hub-place{position:absolute;z-index:2;top:92px;left:16px;right:16px;max-width:360px;

.stl-van-wrap{position:absolute;z-index:2;left:50%;bottom:210px;width:min(68%,310px);transform:translateX(-50%);

  background:rgba(8,11,20,.94);border-top:1px solid rgba(232,227,213,.2);backdrop-filter:blur(10px)}

.garage-van-preview{position:relative;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(110px,.75fr);
  align-items:center;gap:6px;min-height:135px;margin-bottom:10px;padding:7px 10px;
  border:1px solid #34405e;border-radius:11px;background:#0a0f1d;overflow:hidden}
.garage-van-preview canvas{display:block;width:100%;height:118px}
.garage-van-preview b{display:block;color:var(--amber);font-size:12px}
.garage-van-preview small{display:block;color:#aeb5c8;font-size:12px;line-height:1.45;margin-top:3px}
.garage-repair{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;
  padding:10px 11px;margin-bottom:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.garage-repair b{font-size:13px}.garage-repair small{display:block;color:var(--faded);font-size:12px}
.garage-repair .uc-cost{grid-column:1;font-family:var(--mono);font-size:12px;color:var(--faded)}
.garage-repair .tbtn{grid-column:2;grid-row:1/3}
.garage-tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 9px;scrollbar-width:none}
.garage-tabs::-webkit-scrollbar{display:none}
.garage-tabs button{flex:none;border:1px solid var(--line);border-radius:18px;padding:5px 10px;
  color:var(--faded);font-size:12px;background:var(--panel);min-height:44px}
.garage-tabs button.here{color:var(--amber);border-color:var(--amber-dim);background:var(--amber-glow)}
.upgrade-group{overflow:hidden;border:1px solid #2d385d;border-radius:12px;background:var(--panel2)}
.upgrade-group-hero{position:relative;aspect-ratio:3/1;overflow:hidden;border-bottom:1px solid var(--line)}
.upgrade-group-hero img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.upgrade-group-copy{position:absolute;z-index:1;left:9px;top:9px;bottom:9px;max-width:62%;padding:7px 9px;
  display:flex;flex-direction:column;justify-content:center;background:rgba(7,9,16,.84);border-left:2px solid var(--amber);
  text-shadow:0 2px 8px #000}
.upgrade-group-copy b{display:block;color:var(--amber);font-size:14px}.upgrade-group-copy small{font-size:12px;line-height:1.45;color:#c2c8d4}
.upgrade-list{display:grid;gap:7px;padding:9px}
.upgrade-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;
  padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.025)}
.upgrade-card.owned{border-color:rgba(125,201,143,.35);background:rgba(125,201,143,.045)}
.upgrade-card .uc-title{font-size:12.5px;font-weight:700}.upgrade-card .uc-desc{display:block;color:var(--faded);font-size:12px;line-height:1.4;margin-top:2px}
.upgrade-card .uc-cost{font-family:var(--mono);font-size:12px;color:var(--faded);white-space:nowrap;text-align:right}
.upgrade-card .tbtn{grid-column:2;grid-row:1/3;min-width:58px}
.upgrade-install{position:absolute;z-index:40;inset:0;display:flex;flex-direction:column;justify-content:flex-end;
  overflow:hidden;background:#070910}
.upgrade-install-art{position:absolute;inset:0;background-position:center;background-size:cover;opacity:.62}
.upgrade-install-panel{position:relative;z-index:1;padding:18px 16px calc(18px + var(--safe-bottom));
  background:rgba(8,11,20,.96);border-top:1px solid var(--amber-dim);box-shadow:0 -18px 45px rgba(0,0,0,.58)}
.upgrade-install-head small{display:block;color:var(--amber);font:12px/1.3 var(--mono);letter-spacing:.13em}
.upgrade-install-head h3{font-size:21px;margin-top:2px}
.upgrade-adviser{display:grid;grid-template-columns:40px minmax(0,1fr);gap:9px;align-items:center;margin:8px 0;
  padding:8px;border:1px solid rgba(255,180,84,.25);border-radius:10px;background:rgba(15,19,31,.86)}
.upgrade-adviser-face{width:40px;height:40px;object-fit:cover;image-rendering:pixelated;border-radius:9px;border:1px solid var(--amber-dim)}
.upgrade-adviser b,.upgrade-adviser small{display:block}.upgrade-adviser b{color:var(--amber);font-size:12px}
.upgrade-adviser small{margin-top:2px;color:#c9ced9;font-size:12px;line-height:1.4}
.upgrade-compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:5px;margin:12px 0 9px}
.upgrade-compare figure{min-width:0;text-align:center;border:1px solid var(--line);border-radius:10px;background:#080c17;overflow:hidden}
.upgrade-compare canvas{display:block;width:100%;height:94px}
.upgrade-compare figcaption{padding:4px;border-top:1px solid var(--line);color:#aeb5c8;font:12px/1.3 var(--mono)}
.upgrade-arrow{color:var(--amber);font-size:22px}
.upgrade-change{padding:9px 10px;border-left:2px solid var(--amber);background:#141725}
.upgrade-change b{display:block;font-size:13px}.upgrade-change small{display:block;color:#aeb5c8;font-size:12px;line-height:1.45;margin-top:2px}
.upgrade-phases{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:10px 0}
.upgrade-phases span{padding:6px 3px;border:1px solid var(--line);border-radius:7px;color:#68718b;
  text-align:center;font:12px/1.3 var(--mono);transition:border-color .25s,color .25s,background .25s}
.upgrade-phases span.active{border-color:var(--amber-dim);color:var(--amber);background:#2c2119}
.upgrade-phases span.current{border-color:#637092;color:#d9dfed;background:#182039}
.upgrade-step-action{width:100%;min-height:48px;margin-bottom:7px;border:1px solid var(--amber-dim);border-radius:10px;
  background:rgba(255,180,84,.1);color:#ffd59f;font-weight:800}
.upgrade-install-done{width:100%;min-height:48px;border:1px solid var(--amber);border-radius:10px;background:#3a291b;
  color:#ffd59f;font-weight:800;opacity:.35;pointer-events:none;transition:opacity .25s}
.upgrade-install.ready .upgrade-install-done{opacity:1;pointer-events:auto}
@media(max-height:700px){
  .stl-hub-place{top:78px}.ait-runtime .stl-hub-place{top:calc(var(--safe-top) + 120px)}
  .stl-hotspot.market{top:26%}.stl-hotspot.garage{top:31%}.stl-hotspot.people{top:43%}.stl-hotspot.alley{top:44%}
  .stl-van-wrap{bottom:205px;width:min(58%,255px)}.stl-van-wrap canvas{height:122px}
  .stl-route{bottom:267px}
  .stl-section-hero{min-height:190px;padding-top:124px}
  .upgrade-install-panel{padding-top:12px}.upgrade-compare canvas{height:76px}
}
@media(prefers-reduced-motion:reduce){
  .upgrade-phases span,.upgrade-step-action,.upgrade-install-done,.stl-walk-party{transition:none}
  .stl-hub.is-walking .stl-walk-party{animation:none}
}
/* offroad npc chat */
#chatlog{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.cmsg{max-width:90%;padding:8px 11px;border-radius:11px;font-size:13px;line-height:1.5;white-space:pre-wrap}
.cmsg.npc{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.cmsg.me{align-self:flex-end;background:rgba(255,180,84,.1);border:1px solid rgba(255,180,84,.35)}
.cmsg.sys{align-self:center;font-family:var(--mono);font-size:12px;color:var(--dim);background:none}
.cmsg.npc,.cmsg.me{display:flex;gap:8px;align-items:flex-start}
.cmsg img{width:30px;height:30px;border-radius:8px;object-fit:cover;image-rendering:pixelated;
  border:1px solid #39456f;flex:none}
.cmsg>span{display:flex;flex-direction:column;gap:2px;min-width:0}.cmsg b{font:12px/1.3 var(--mono);color:var(--amber)}
.cmsg>span>span{white-space:pre-wrap}.dialogue-choice-label{margin:8px 0 5px;color:var(--faded);
  font:12px/1.3 var(--mono);letter-spacing:.12em}
#chatin{display:flex;gap:7px}
#chatin input{flex:1;background:#0a0d18;border:1px solid var(--line);border-radius:9px;color:var(--paper);
  padding:9px 11px;font-size:13px;min-width:0}
#chatin button{flex:none;border:1px solid var(--amber-dim);color:var(--amber);border-radius:9px;padding:0 15px;
  font-size:13px;background:rgba(255,180,84,.08)}
#chatin button:disabled{opacity:.4}

/* ── party strip ── */
#party{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.pcard{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
  padding:5px 10px 5px 7px;background:var(--panel);font-size:12px;position:relative;cursor:pointer;
  transition:border-color .15s}
.pcard[data-comp]:hover{border-color:var(--amber-dim)}
.pcard .pf{width:24px;height:24px;border-radius:7px;background:#0a0d18;display:flex;align-items:center;
  justify-content:center;font-size:13px;border:1px solid var(--line)}
.pcard .pm{font-family:var(--mono);font-size:12px;color:var(--faded)}
.pcard .plv{font-family:var(--mono);font-size:12px;color:var(--amber)}
.pimg{width:100%;height:100%;object-fit:cover;border-radius:inherit;image-rendering:pixelated;display:block}
.ico{width:13px;height:13px;vertical-align:-2px;image-rendering:pixelated;margin-right:3px;display:inline-block}
.ico.big{width:16px;height:16px;vertical-align:-3px}
.pbadge{position:absolute;top:-6px;right:-5px;color:var(--amber);font-size:12px;
  text-shadow:0 0 6px var(--amber);animation:blink 1.6s infinite}
/* ── 동료 시트 ── */
.comp-head{display:flex;gap:12px;align-items:center}
.comp-face{flex:none;width:46px;height:46px;border-radius:12px;background:#0a0d18;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px}
.clvl{font-family:var(--mono);font-size:12px;color:var(--amber);font-weight:400}
.csub{color:var(--faded);font-size:12px;margin-top:2px}
.bond{margin:10px 0 4px}
.bond .lab{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.12em;margin-bottom:4px;
  display:flex;justify-content:space-between}
.bond .bar{height:4px;background:#0a0d18;border-radius:2px;overflow:hidden}
.bond .bar i{display:block;height:100%;background:linear-gradient(90deg,#7fd8d8,var(--amber));
  border-radius:2px;transition:width .4s}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pk{border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--panel)}
.pk b{font-size:12.5px;color:var(--amber)}
.pk.story b{color:var(--cheollian)}
.pk small{display:block;color:var(--faded);font-size:12px;margin-top:1px;line-height:1.5}

/* ── ending ── */
#scr-end{padding:30px 26px;overflow-y:auto;justify-content:center}
#scr-end .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.3em;margin-bottom:14px}
#scr-end h1{font-size:28px;line-height:1.25;margin-bottom:14px;text-wrap:balance}
#scr-end .body{font-family:var(--serif);color:#cdd1dd;font-size:14.5px;line-height:1.9;white-space:pre-wrap;
  margin-bottom:22px}
#endstats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:22px}
#endstats .st{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
#endstats .st .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--dim)}
#endstats .st .v{font-family:var(--mono);font-size:17px;color:var(--amber);font-variant-numeric:tabular-nums;margin-top:2px}

/* toast */
#toasts{position:absolute;top:auto;bottom:calc(62px + var(--safe-bottom));left:12px;right:12px;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:40;pointer-events:none;
  transition:opacity .16s,visibility .16s}
#ev-wrap.on~#toasts,#ovl-stl.on~#toasts,#ovl-map.on~#toasts,#ovl-journal.on~#toasts,
#ovl-status.on~#toasts,#ovl-seoul.on~#toasts{opacity:0;visibility:hidden}
.toast{width:max-content;max-width:min(78%,360px);background:rgba(12,15,26,.92);
  border:1px solid var(--line);border-radius:11px;padding:7px 10px;box-shadow:0 7px 22px rgba(0,0,0,.24);
  font-size:12px;line-height:1.4;opacity:0;transform:translateY(6px) scale(.98);
  transition:opacity .24s,transform .24s;backdrop-filter:blur(5px)}
.toast.show{opacity:1;transform:none}
.toast .ic{color:var(--amber);margin-right:5px}
.toast.discover{border-color:var(--amber-dim);color:var(--amber)}
.note,.upgrade-card,.crew-status-card,.stl-field-action{content-visibility:auto;contain-intrinsic-size:auto 112px}
.ui-large-text .sheet .body,.ui-large-text .story-turn-text,.ui-large-text .outcome,
.ui-large-text .choice,.ui-large-text .st-row,.ui-large-text .stl-field-action small,
.ui-large-text .stl-field-result p,.ui-large-text .cmsg{font-size:15px;line-height:1.62}
.ui-large-text .story-context,.ui-large-text .combat-objective,.ui-large-text .mission-strip,
.ui-large-text .st-sec .csub,.ui-large-text .stl-field-focus-copy span{font-size:12.5px;line-height:1.5}
.ui-large-text .event-choice-dock>.choices{max-height:min(35dvh,320px)}
.ui-reduce-motion *{animation-duration:.001ms!important;animation-iteration-count:1!important;
  transition-duration:.001ms!important;scroll-behavior:auto!important}
#bt-song{position:absolute;right:14px;bottom:8px;min-height:40px;font-family:var(--mono);font-size:12px;
  letter-spacing:.05em;color:var(--faded);background:none;border:1px solid var(--line);
  border-radius:20px;padding:7px 12px;cursor:pointer;transition:color .3s,border-color .3s}
#bt-song.playing{color:var(--amber);border-color:var(--amber-dim);animation:songpulse 2.2s ease-in-out infinite}
@keyframes songpulse{50%{opacity:.55}}

.stl-hub:not(.stl-hub-miryang){
  isolation:isolate;
  background:#15130f;
}
.stl-hub:not(.stl-hub-miryang) .stl-hub-art{
  background-position:var(--place-art-position,50% 50%);
  filter:saturate(.88) contrast(1.05);
}
.stl-hub:not(.stl-hub-miryang) .stl-hub-art::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(8,8,7,.06) 28%,rgba(8,8,7,.78) 100%),
    radial-gradient(circle at 68% 34%,var(--place-glow),transparent 38%);
}
.stl-hub:not(.stl-hub-miryang) .stl-hub-place{
  border-left:3px solid var(--place-accent);
  background:linear-gradient(105deg,var(--place-panel),rgba(18,16,13,.66));
  box-shadow:0 12px 30px rgba(0,0,0,.28),inset 0 0 0 1px rgba(255,255,255,.07);
  backdrop-filter:blur(7px);
}
.stl-hub:not(.stl-hub-miryang) .stl-hub-place::after{

.stl-hub-daejeon .stl-hub-place::after{content:"연구단지 코뮌 · 기술 복구선"}
.stl-hub-suwon .stl-hub-place::after{content:"성곽 공동체 · 서울 전초선"}
.stl-hub-gwangju .stl-hub-place::after{content:"대인시장 · 서남 교역선"}

.stl-hub:not(.stl-hub-miryang) .stl-hotspot{

}
.stl-hub:not(.stl-hub-miryang) .stl-hotspot:hover,

/* ── 사건 집중 모드 ─────────────────────────────────────────
   긴 대화의 모든 턴을 동시에 펼치면 모바일에서 이미지·본문·선택지가 서로
   경쟁한다. DOM과 진행 카운트는 유지하고 현재 문맥 두 턴만 시각화한다. */
#ev-wrap.on{background:rgba(5,7,13,.96);backdrop-filter:blur(10px)}
#ev-sheet.story-compact .story-reader [data-story-entry]:not(:nth-last-child(-n+2)),
#ev-sheet.story-compact .story-transcript>.chat-msg:not(:nth-last-child(-n+2)){
  display:none!important;
}
#ev-sheet.story-compact .story-reader{min-height:0}
