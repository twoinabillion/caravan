/* ── Field Board visual finish — 7 cities × 4 facilities ──
   Every facility keeps the same head/list/action structure while the city
   palette changes its powered sign, metal surface and small light accents. */
.field-board-visual-finish{
  --roof:#34383a;--light:#e5a54c;--accent:#b94c3e;
  --fb-head-bg:color-mix(in srgb,var(--roof) 82%,#0e1113);
  --fb-body-bg:color-mix(in srgb,var(--roof) 34%,#131618);
  --fb-title:color-mix(in srgb,var(--light) 62%,#fff2d8);
  min-height:0;max-height:100%;flex:0 1 auto;color:#e6e1d7;background:transparent;overflow:hidden
}
.field-board-visual-finish .field-board-head{
  position:relative;min-height:96px;padding:16px 18px 13px;overflow:hidden;
  /* 기존 금속 프레임(9-slice)을 버리지 않는다 — 판을 '물건'으로 만드는 건 이 테두리다.
     새 내부(도트·글로우·표면)는 프레임 안쪽에 얹는다. fill은 절대 넣지 말 것. */
  border:12px solid transparent;border-radius:0;
  border-image:var(--fb-frame) 24 / 12px / 0 stretch;image-rendering:pixelated;
  background:
    repeating-linear-gradient(180deg,rgba(0,0,0,.30) 0 1px,transparent 1px 3px),
    radial-gradient(120% 150% at 12% -10%,color-mix(in srgb,var(--light) 18%,transparent),transparent 55%),
    linear-gradient(168deg,var(--fb-head-bg),color-mix(in srgb,var(--roof) 46%,#101315) 70%,color-mix(in srgb,var(--roof) 30%,#0d1012));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -14px 22px rgba(0,0,0,.42),0 5px 16px rgba(0,0,0,.6)
}
.field-board-visual-finish .field-board-head::before{content:none}
.field-board-visual-finish .field-board-head::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(circle at 50% 50%,rgba(0,0,0,.55) 32%,transparent 34%);
  background-size:3px 3px
}
.field-board-visual-finish .field-board-mark{position:relative;z-index:2;display:block;margin-bottom:7px;color:#7e8a86;font:800 7px/1 var(--mono);letter-spacing:.2em}
.field-board-visual-finish .field-board-head>div{position:relative;z-index:2;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.field-board-visual-finish .field-board-head h3{margin:0;color:var(--fb-title);font:900 20px/1.05 var(--sans);letter-spacing:-.01em;text-shadow:0 0 12px color-mix(in srgb,var(--light) 55%,transparent),0 0 3px color-mix(in srgb,var(--light) 80%,transparent)}
.field-board-visual-finish .field-board-head em{flex:none;color:#93a09b;font:700 8px/1 var(--mono);font-style:normal;white-space:nowrap}
.field-board-visual-finish .field-board-head i{display:inline-block;width:5px;height:5px;margin-right:7px;border-radius:1px;background:var(--light);box-shadow:0 0 7px var(--light)}
.field-board-visual-finish .field-board-head p{position:relative;z-index:2;margin:6px 0 0;color:#9aa3a0;font:600 9px/1.2 var(--sans)}
.field-board-visual-finish .field-board-body{
  min-height:0;flex:0 1 auto;margin-top:7px;padding:9px 11px 14px;overflow-y:auto;overscroll-behavior:contain;
  border:0;border-radius:3px;background:
    linear-gradient(180deg,rgba(255,255,255,.035),transparent 90px),
    repeating-linear-gradient(93deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),
    linear-gradient(172deg,var(--fb-body-bg),#111416);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 40px rgba(0,0,0,.45);
  mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent)
}
.field-board-visual-finish .field-board-group>header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-height:0;padding:13px 3px 6px;border:0}
.field-board-visual-finish .field-board-group>header span{color:var(--light);font:800 9px/1 var(--mono);letter-spacing:.15em}
.field-board-visual-finish .field-board-group>header b{color:#7f8a87;font:700 8px/1 var(--mono)}
.field-board-visual-finish .field-board-row{display:flex;align-items:center;gap:10px;min-height:58px;width:100%;margin:0;padding:9px 4px;border:0;background:none;text-align:left;box-shadow:none}
.field-board-visual-finish .field-board-row+.field-board-row{border-top:1px dashed rgba(255,255,255,.055)}
.field-board-visual-finish .field-board-row-icon{display:grid;width:26px;height:26px;flex:none;place-content:center;border:0;border-radius:3px;background:linear-gradient(160deg,color-mix(in srgb,var(--roof) 60%,#3a3f36),color-mix(in srgb,var(--roof) 40%,#22262a));box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.field-board-visual-finish .field-board-row-icon .ico{width:20px;height:20px}
.field-board-visual-finish .field-board-row-copy{display:block;flex:1;min-width:0}
.field-board-visual-finish .field-board-row-copy b{display:block;overflow:hidden;color:#e9e3d6;font:700 13px/1.25 var(--sans);white-space:nowrap;text-overflow:ellipsis}
.field-board-visual-finish .field-board-row-copy small{display:block;overflow:hidden;color:#7f8a87;font:400 10px/1.3 var(--sans);white-space:normal}
.field-board-visual-finish .field-board-row-meta{flex:none;color:#cbb188;font:700 9px/1 var(--mono);white-space:nowrap}
.field-board-chevron{display:none}
.field-board-visual-finish .field-board-row.selected,
.field-board-visual-finish .field-board-row[aria-pressed="true"]{margin:2px -6px;padding:11px 10px;border:0;border-radius:3px;background:linear-gradient(100deg,color-mix(in srgb,var(--light) 22%,transparent),color-mix(in srgb,var(--light) 6%,transparent) 62%,transparent);box-shadow:inset 2px 0 0 var(--light),0 2px 8px rgba(0,0,0,.4)}
.field-board-visual-finish .field-board-row.selected .field-board-row-copy b{color:color-mix(in srgb,var(--light) 45%,#fff0d9)}
.field-board-visual-finish .field-board-note{position:relative;display:block;width:100%;min-height:58px;margin:0 0 7px;padding:10px 12px 10px 13px;border:0;border-left:2px solid var(--accent);border-radius:2px;background:linear-gradient(168deg,#3a332a,#2a251e);box-shadow:0 2px 6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06);color:#f3e6cd;text-align:left}
.field-board-visual-finish .field-board-note::before{content:"";position:absolute;top:-3px;left:12px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9b071,#7d5a2c);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.field-board-visual-finish .field-board-note>div{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.field-board-visual-finish .field-board-note b{min-width:0;overflow:hidden;color:#f3e6cd;font:700 13px/1.25 var(--sans);white-space:nowrap;text-overflow:ellipsis}
.field-board-visual-finish .field-board-note .field-board-row-meta{flex:none;color:#e0b573;font:700 9px/1 var(--mono);white-space:nowrap}
.field-board-visual-finish .field-board-note small{display:block;margin-top:3px;overflow:hidden;color:#a2988a;font:400 10px/1.4 var(--sans);white-space:normal}
.field-board-visual-finish .field-board-note.selected,
.field-board-visual-finish .field-board-note[aria-pressed="true"]{outline:1px solid color-mix(in srgb,var(--light) 55%,transparent);background:linear-gradient(168deg,color-mix(in srgb,var(--light) 14%,#3a332a),#2a251e);box-shadow:0 2px 8px rgba(0,0,0,.58),inset 2px 0 0 var(--light),0 0 10px color-mix(in srgb,var(--light) 18%,transparent)}
.field-board-visual-finish .field-board-note[data-unavailable="true"]:not(.selected){opacity:.58}

/* 2026-08-21 full UI QA: keep dense states readable without changing the visual language. */
#intro-page{padding-right:clamp(30px,6cqw,46px);padding-left:clamp(30px,6cqw,46px)}
#intro-txt{scroll-padding-block:18px 38px;overscroll-behavior:contain}

/* Manuscript dialogue: scene prose, speakers and decisions share one reading
   column. Portraits identify a new speaker; the text never zigzags like chat. */
#intro-txt .intro-chat,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat{
  box-sizing:border-box!important;display:flex!important;flex-direction:column!important;
  width:100%!important;min-height:min-content;overflow:visible!important;
  padding:6px 2px 30px!important;gap:12px!important;transform:none!important
}
#intro-txt .intro-chat .chat-msg,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-msg{
  box-sizing:border-box!important;display:grid!important;
  grid-template-columns:42px minmax(0,1fr)!important;align-items:start!important;
  gap:0 10px!important;width:100%!important;max-width:100%!important;min-height:max-content;
  flex:0 0 auto!important;margin:0!important;padding:0!important;overflow:visible!important;
  text-align:left!important;transform:none!important
}
#intro-txt .intro-chat .intro-portrait-photo,
#intro-txt .intro-chat .chat-avatar,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-avatar{
  position:static!important;grid-column:1!important;grid-row:1 / span 2!important;
  display:block!important;box-sizing:border-box!important;flex:none!important;
  width:42px!important;height:44px!important;margin:0!important;border-radius:7px!important;
  object-fit:cover!important;object-position:50% 18%!important;transform:none!important
}
#intro-txt .intro-chat .intro-portrait-photo .chat-avatar{
  width:100%!important;height:100%!important
}
#intro-txt .intro-chat .chat-copy,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-copy{
  grid-column:2!important;display:block!important;box-sizing:border-box!important;
  width:100%!important;max-width:none!important;min-width:0!important;margin:0!important;
  padding:0!important;text-align:left!important
}
#intro-txt .intro-chat .chat-name,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-name{
  display:block!important;margin:0 0 3px!important;color:#28746f!important;
  font:850 12px/1.25 var(--sans)!important;letter-spacing:.035em!important;text-align:left!important
}
#intro-txt .intro-chat .mine .chat-name,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .mine .chat-name{
  color:#8a5415!important
}
#intro-txt .intro-chat .chat-bubble,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-bubble{
  display:block!important;box-sizing:border-box!important;width:100%!important;max-width:none!important;
  margin:0!important;padding:0!important;overflow:visible!important;border:0!important;border-radius:0!important;
  color:#342f28!important;background:transparent!important;box-shadow:none!important;
  font:500 14px/1.68 var(--serif)!important;text-align:left!important;overflow-wrap:anywhere!important;
  -webkit-line-clamp:unset!important;-webkit-box-orient:initial!important
}
#intro-txt .intro-chat .chat-bubble:before,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-bubble:before{
  content:"“";color:#8a5415;font-weight:800
}
#intro-txt .intro-chat .chat-bubble:after,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-bubble:after{
  content:"”";color:#8a5415;font-weight:800
}
#intro-txt .intro-chat .speaker-continuation .intro-portrait-photo,
#intro-txt .intro-chat .speaker-continuation>.chat-avatar,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .speaker-continuation>.chat-avatar{
  visibility:hidden!important
}
#intro-txt .intro-chat .speaker-continuation .chat-name,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .speaker-continuation .chat-name{
  display:none!important
}
#intro-txt .intro-chat .story-narration,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .story-narration{
  box-sizing:border-box!important;width:100%!important;margin:0!important;padding:7px 0 8px!important;
  border:0!important;background:transparent!important;box-shadow:none!important
}
#intro-txt .intro-chat .story-narration-label,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .story-narration-label{
  display:none!important
}
#intro-txt .intro-chat .story-narration-text,
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .story-narration-text{
  color:#494138!important;font:500 14px/1.7 var(--serif)!important
}

/* The mission is a manuscript preface, not a floating card over the page. */
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report{
  box-sizing:border-box!important;padding-right:clamp(30px,7cqw,48px)!important;
  padding-left:clamp(30px,7cqw,48px)!important
}
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .event-head{
  position:static!important;box-sizing:border-box!important;margin:0!important;padding:4px 0 14px!important
}
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .mission-brief{
  box-sizing:border-box!important;width:100%!important;margin:0 0 18px!important;padding:14px 0 16px!important;
  border:0!important;border-top:1px solid rgba(73,58,39,.32)!important;
  border-bottom:1px solid rgba(73,58,39,.32)!important;border-radius:0!important;
  background:transparent!important;box-shadow:none!important
}
#ev-sheet.event-mode[data-event-kind="story"] .mission-brief>span{
  display:block!important;margin:0 0 7px!important;color:#8a5415!important;
  font:800 11px/1.3 var(--mono)!important;letter-spacing:.13em!important
}
#ev-sheet.event-mode[data-event-kind="story"] .mission-brief h3{
  margin:0 0 12px!important;color:#302a22!important;font:850 18px/1.35 var(--serif)!important
}
#ev-sheet.event-mode[data-event-kind="story"] .mission-brief p,
#ev-sheet.event-mode[data-event-kind="story"] .mission-brief small{
  display:grid!important;grid-template-columns:72px minmax(0,1fr)!important;gap:10px!important;
  margin:0!important;padding:6px 0!important;color:#4a4136!important;
  font:500 12.5px/1.5 var(--sans)!important
}
#ev-sheet.event-mode[data-event-kind="story"] .mission-brief p b,
#ev-sheet.event-mode[data-event-kind="story"] .mission-brief small b{
  color:#8a5415!important;font-weight:850!important
}
#ev-sheet.event-mode[data-event-kind="story"] .mission-brief .mission-promise b{color:#28746f!important}

/* Choices arrive as the final sentences of the event, not a second bulky panel. */
#ev-sheet.event-mode[data-event-kind="story"] .event-choice-dock{
  box-sizing:border-box!important;flex:0 0 auto!important;height:auto!important;min-height:0!important;
  padding:6px clamp(26px,6cqw,44px) calc(12px + var(--safe-bottom))!important;
  border-top:1px solid rgba(62,49,33,.38)!important;background:#d4be8e!important
}
#ev-sheet.event-mode[data-event-kind="story"] .event-choice-dock>.choices{
  display:flex!important;flex-direction:column!important;gap:0!important;
  width:100%!important;height:auto!important;max-height:none!important;overflow:visible!important
}
#ev-sheet.event-mode[data-event-kind="story"] .event-choice-dock .choices>.choice{
  box-sizing:border-box!important;display:block!important;width:100%!important;min-height:0!important;
  margin:0!important;padding:10px 2px!important;border:0!important;
  border-bottom:1px solid rgba(75,59,39,.24)!important;border-radius:0!important;
  color:#312b23!important;background:transparent!important;box-shadow:none!important;text-align:left!important
}
#ev-sheet.event-mode[data-event-kind="story"] .event-choice-dock .choices>.choice:last-child{
  border-bottom:0!important
}
#ev-sheet.event-mode[data-event-kind="story"] .choice-head{
  display:grid!important;grid-template-columns:24px minmax(0,1fr)!important;gap:8px!important;align-items:start!important
}
#ev-sheet.event-mode[data-event-kind="story"] .choice-index{
  display:block!important;color:#28746f!important;font:850 13px/1.5 var(--mono)!important;text-align:center!important
}
#ev-sheet.event-mode[data-event-kind="story"] .choice-index small{display:none!important}
#ev-sheet.event-mode[data-event-kind="story"] .choice-index b{font:inherit!important}
#ev-sheet.event-mode[data-event-kind="story"] .choice-title{
  display:block!important;color:#312b23!important;font:750 14px/1.5 var(--serif)!important
}
#ev-sheet.event-mode[data-event-kind="story"] .choice-intent{
  display:inline!important;margin-right:7px!important;padding:0!important;border:0!important;
  color:#8a5415!important;background:transparent!important;font:800 10px/1.5 var(--sans)!important
}
#ev-sheet.event-mode[data-event-kind="story"] .event-choice-dock .req{
  display:block!important;margin:3px 0 0 32px!important;color:#6c5b45!important;font-size:11px!important
}

/* Beat the older portrait-specific flex rules: every authored conversation,
   including combat preamble, uses the same stable manuscript column. */
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-msg:has(.chat-avatar),
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .chat-msg:has(.chat-avatar){
  display:grid!important;grid-template-columns:42px minmax(0,1fr)!important;
  align-items:start!important;gap:0 10px!important;width:100%!important;
  margin:0!important;padding:0!important;flex-direction:initial!important;text-align:left!important
}
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-msg:has(.chat-avatar)>.chat-avatar,
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .chat-msg:has(.chat-avatar)>.chat-avatar{
  position:static!important;grid-column:1!important;grid-row:1 / span 2!important;
  order:initial!important;width:42px!important;height:44px!important;margin:0!important;
  border-radius:7px!important;object-fit:cover!important;object-position:50% 18%!important
}
#ev-sheet.event-mode[data-event-kind="story"] .event-field-report .story-chat .chat-msg:has(.chat-avatar)>.chat-copy,
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .chat-msg:has(.chat-avatar)>.chat-copy{
  grid-column:2!important;order:initial!important;display:block!important;width:100%!important;
  max-width:none!important;margin:0!important;padding:0!important;text-align:left!important
}
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat{
  box-sizing:border-box!important;display:flex!important;flex-direction:column!important;
  width:100%!important;padding:6px 2px 22px!important;gap:12px!important
}
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .chat-name{
  display:block!important;margin:0 0 3px!important;color:#28746f!important;
  font:850 12px/1.25 var(--sans)!important;text-align:left!important
}
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .mine .chat-name{color:#8a5415!important}
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .chat-bubble{
  display:block!important;width:100%!important;max-width:none!important;margin:0!important;padding:0!important;
  overflow:visible!important;border:0!important;border-radius:0!important;background:transparent!important;
  box-shadow:none!important;color:#342f28!important;font:500 14px/1.68 var(--serif)!important;
  text-align:left!important;-webkit-line-clamp:unset!important
}
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .chat-bubble:before{
  content:"“";color:#8a5415;font-weight:800
}
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .chat-bubble:after{
  content:"”";color:#8a5415;font-weight:800
}
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .speaker-continuation>.chat-avatar{
  visibility:hidden!important
}
#ev-sheet.event-mode[data-event-kind="combat"] .event-field-report .story-chat .speaker-continuation .chat-name{
  display:none!important
}

/* Settlement conversations use the same reading grammar on their dark surface. */
.stl-talk-slot .dlg.talk{
  box-sizing:border-box;margin:0;padding:14px 16px;border:1px solid rgba(126,145,174,.32);
  border-radius:4px;background:#10151f;box-shadow:none
}
.stl-talk-slot .npc-talk-head{
  display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;
  margin:0 0 12px;padding:0 0 12px;border-bottom:1px solid rgba(255,255,255,.08)
}
.stl-talk-slot .npc-talk-head .npc-face{
  width:44px;height:46px;border-radius:7px;grid-column:1
}
.stl-talk-slot .npc-talk-head .say{
  grid-column:2;margin:0;color:#d8d5cc;font:500 14px/1.68 var(--serif);text-align:left
}
.stl-talk-slot .npc-talk-head .say .spk{
  display:block;margin-bottom:3px;color:#d9a85a;font:850 12px/1.25 var(--sans);letter-spacing:.035em
}
.stl-talk-slot .dialogue-choice-label{
  margin:0;padding:9px 0 5px;border-top:1px solid rgba(255,255,255,.08);
  color:#8290a8;font-size:10px
}
.stl-talk-slot .choices{display:flex;flex-direction:column;gap:0}
.stl-talk-slot .choice,
.stl-talk-slot .choice:last-child:nth-child(odd){
  grid-column:auto;width:100%;min-height:0;margin:0;padding:10px 2px;
  border:0;border-bottom:1px solid rgba(255,255,255,.08);border-radius:0;
  color:#d8d5cc;background:transparent;box-shadow:none;font:650 13px/1.5 var(--serif);text-align:left
}
.stl-talk-slot .choice:last-child{border-bottom:0;color:#9da6b7}

/* Free-form NPC chat remains interactive, but no longer imitates a messenger. */
#chatlog{display:flex;flex-direction:column;gap:12px;margin:2px 0 14px}
#chatlog .cmsg{
  box-sizing:border-box;display:grid;grid-template-columns:34px minmax(0,1fr);
  gap:0 9px;align-self:stretch;width:100%;max-width:none;margin:0;padding:0;
  border:0;border-radius:0;color:#d8d5cc;background:transparent;font:500 13.5px/1.62 var(--serif)
}
#chatlog .cmsg img{
  grid-column:1;grid-row:1 / span 2;width:34px;height:36px;margin:0;
  border-radius:6px;object-fit:cover;object-position:50% 18%
}
#chatlog .cmsg>span{grid-column:2;display:block;min-width:0}
#chatlog .cmsg b{
  display:block;margin-bottom:2px;color:#78b8b1;font:850 11.5px/1.3 var(--sans);letter-spacing:.035em
}
#chatlog .cmsg.me b{color:#d9a85a}
#chatlog .cmsg>span>span{display:block;white-space:pre-wrap}
#chatlog .cmsg>span>span:before{content:"“";color:#d9a85a;font-weight:800}
#chatlog .cmsg>span>span:after{content:"”";color:#d9a85a;font-weight:800}
#chatlog .cmsg.speaker-continuation img{visibility:hidden}
#chatlog .cmsg.speaker-continuation b{display:none}
#chatlog .cmsg.sys{
  display:block;align-self:stretch;padding:7px 0;color:#8993a6;
  border-top:1px solid rgba(255,255,255,.07);font:11px/1.45 var(--mono);text-align:left
}
#chatin{padding-top:10px;border-top:1px solid rgba(255,255,255,.09)}

#ev-sheet.event-mode[data-event-kind="combat"][data-story-step="decision"]:not(.combat-details-open) .event-scroll{
  flex:0 0 auto!important;height:auto!important;min-height:0
}
#ev-sheet.event-mode[data-event-kind="combat"][data-story-step="decision"]:not(.combat-details-open) .event-choice-dock{
  flex:0 0 auto!important;height:auto!important;min-height:0
}
#ev-sheet.event-mode[data-event-kind="combat"][data-story-step="decision"].combat-details-open .event-scroll{
  flex:0 0 60%!important;height:60%!important;min-height:0;overflow-y:auto
}
#ev-sheet.event-mode[data-event-kind="combat"][data-story-step="decision"].combat-details-open .event-choice-dock{
  flex:1 1 40%!important;height:40%!important;min-height:0
}
#ev-sheet.event-mode[data-event-kind="combat"] .event-choice-dock>.choices{
  flex:0 1 auto;height:auto;max-height:calc(100% - 62px)
}
#ev-sheet.event-mode[data-event-kind="combat"] .event-detail-toggle{margin:12px auto 0;flex:0 0 auto}

#jp-log .note{position:relative;cursor:pointer;padding:11px 13px 12px}
#jp-log .note:focus-visible{outline:2px solid var(--teal,#58d7c7);outline-offset:-2px}
#jp-log .note p{
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-bottom:4px
}
#jp-log .note .links{max-height:25px;overflow:hidden}
#jp-log .note::after{
  content:'자세히';display:block;margin-top:7px;color:var(--teal,#58d7c7);font-size:11px;letter-spacing:.06em
}
#jp-log .note.expanded p{display:block;overflow:visible}
#jp-log .note.expanded .links{max-height:none}
#jp-log .note.expanded::after{content:'접기'}

.field-board-row{min-height:62px}
.field-board-row-copy small,.field-board-row-meta{font-size:12px;line-height:1.35}
.field-board-action{min-height:80px;padding-block:9px}
.field-board-action button{min-height:44px}

#profile-detail{display:none}

@media(max-height:720px){
  #ev-sheet.event-mode[data-event-kind="combat"][data-story-step="decision"].combat-details-open .event-scroll{
    flex-basis:58%!important;height:58%!important
  }
  #ev-sheet.event-mode[data-event-kind="combat"][data-story-step="decision"].combat-details-open .event-choice-dock{
    flex-basis:42%!important;height:42%!important
  }
  #intro-txt .intro-chat{padding-bottom:26px;gap:12px}
}
@container game (max-width:350px){
  #intro-txt .intro-chat{padding-right:0!important;padding-left:0!important;gap:11px!important}
}
/* Road information has three stable lanes: HUD/toasts, private thought, and crew dialogue.
   A thought is intentionally text-only so it cannot be mistaken for spoken dialogue. */
#bubbles.thought-active{box-sizing:border-box;justify-content:flex-start;align-items:flex-start;
  padding:clamp(116px,16vh,136px) 18px 0}
#bubbles .bubble.thought{max-width:min(72vw,270px);margin:0;padding:8px 11px;
  border-color:rgba(255,180,84,.34);background:rgba(19,18,23,.78);
  box-shadow:0 8px 20px rgba(0,0,0,.2)}
#bubbles .bubble.thought .bubble-copy{min-width:0}
#bubbles .bubble.thought .who{letter-spacing:.12em}

/* Route choices retain the destination view while carrying only the context needed
   to decide: main purpose, party size and one tracked secondary objective. */
.nav-journey-context{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;
  gap:2px 8px;margin:0 0 4px;padding:0 0 5px;border-bottom:1px solid rgba(104,198,189,.2);
  color:#c5d0cf;font-family:var(--mono)}
.nav-journey-core{display:flex;align-items:baseline;gap:5px;min-width:0}
.nav-journey-core small{flex:none;color:var(--teal);font-size:9px;letter-spacing:.08em}
.nav-journey-core b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:#e5e0d3;font-size:10px;font-weight:700}
.nav-journey-party{color:#b7bfbd;font-size:9px;white-space:nowrap}
.nav-journey-side{grid-column:1/-1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:#9ea9a7;font-size:9px}
.journey-local-screen.local-action-count-5 .local-actions{
  grid-template-rows:repeat(5,25%);grid-auto-rows:25%;overflow-x:hidden;overflow-y:auto;
  overscroll-behavior:contain;scroll-snap-type:y proximity;scrollbar-width:thin;
  scrollbar-color:rgba(255,180,84,.48) transparent;touch-action:pan-y}
.journey-local-screen.local-action-count-5 .local-actions::-webkit-scrollbar{width:4px}
.journey-local-screen.local-action-count-5 .local-actions::-webkit-scrollbar-thumb{background:rgba(255,180,84,.48)}
.journey-local-screen.local-action-count-5 .stop-action-card{scroll-snap-align:start}
body.quest-ledger-open #frame{width:min(100%,480px)!important;max-width:480px!important;margin-left:auto!important;margin-right:auto!important}
body.quest-ledger-open #quest-ledger{width:min(100%,480px)!important;max-width:480px!important;left:50%!important;right:auto!important;transform:translateX(-50%)!important}
#ovl-map .map-live-head{transform:translateX(6px)!important}
.journey-local-screen.local-action-count-5 .stop-action-chips{display:none!important}
.journey-local-screen.local-action-count-5 .stop-action-icon{width:clamp(27px,9cqw,42px);height:clamp(27px,9cqw,42px)}
.journey-local-screen.local-action-count-5 .stop-action-copy>b{font-size:clamp(10px,3.15cqw,14px)}
.journey-local-screen.local-action-count-5 .stop-action-cta{font-size:clamp(10px,3.05cqw,14px)}
.nav-route-summary:has(.nav-journey-context) .nav-place-description{margin-bottom:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;line-height:1.25}
.nav-map-destination-badge small{display:none}
.nav-destination-card{position:relative}
.nav-depart-hint{position:absolute;top:5px;right:5px;padding:2px 5px;border:1px solid rgba(255,180,84,.55);
