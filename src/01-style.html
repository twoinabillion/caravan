#ev-sheet.story-compact .chat-msg,
#ev-sheet.story-compact .story-narration{margin-top:0}
@media(max-width:680px){
  #ev-sheet.story-compact .event-scene-frame{max-height:min(34dvh,270px)}
  #ev-sheet.story-compact .event-scroll{scroll-padding-bottom:180px}
  #ev-sheet.story-compact .event-head{margin-top:8px}

  /* 모바일 정보 계층: 핵심 임무와 현재 행동을 먼저, 보조 정보는 일지에서. */
  .mission-strip{min-height:50px;padding:5px 10px}
  .mission-strip.has-secondary{min-height:66px}
  .mission-strip .ms-secondary-wrap{margin-top:3px;padding-top:4px;gap:4px}
  .mission-strip .ms-secondary-wrap .ms-chip:nth-of-type(n+3){display:none}
  .journey-context{margin-bottom:10px;padding:8px;gap:5px}
  .journey-context-head{padding-bottom:0}
  .journey-guide{margin-bottom:10px;padding:9px 10px}
  .road-guest-card,.road-checkin{margin-top:8px;padding:9px 10px}
}

/* 첫 35km에는 본편 목적과 다음 행동만 보인다. 게시판·동료 보조 임무는
   사라지는 것이 아니라 지도와 일지에 남고, 첫 루프를 익힌 뒤 펼쳐진다. */
html[data-journey-stage="first"] .mission-strip .ms-secondary-wrap{display:none}
html[data-journey-stage="first"] .mission-strip.has-secondary{min-height:56px}

/* ── cinematic journey shell ─────────────────────────────────
   정보판이 아니라 풍경이 첫 인상이 된다. 계기판은 이미지 가장자리에 겹치고,
   현재 결정 두 개만 장면 위에 남는다. */
#stage{flex-basis:clamp(300px,42dvh,410px)}
html[data-travel-state="driving"] #stage,html[data-travel-state="ignition"] #stage{flex-basis:clamp(350px,52dvh,500px)}
#dash{z-index:11;margin:-64px 10px 0;border:1px solid rgba(232,227,213,.14);border-radius:14px 14px 5px 5px;
  background:linear-gradient(180deg,rgba(9,12,21,.72),rgba(10,14,25,.95));
  box-shadow:0 14px 30px rgba(0,0,0,.3);backdrop-filter:blur(12px)}
#mission-strip{width:calc(100% - 20px);margin:8px 10px 0;border:1px solid rgba(255,180,84,.2);border-radius:8px;
  background:linear-gradient(90deg,rgba(255,180,84,.075),rgba(12,16,28,.94) 42%)}
#main{z-index:4;margin-top:8px;border-radius:18px 18px 0 0;background:
  radial-gradient(90% 50% at 50% 0%,rgba(59,74,112,.11),transparent 70%),var(--night);
  box-shadow:0 -1px rgba(255,255,255,.045),0 -16px 44px rgba(0,0,0,.16)}
#panel{padding-top:14px}
#stage-actions{position:absolute;z-index:12;left:14px;right:14px;bottom:76px;display:flex;justify-content:center;gap:8px;
  pointer-events:none}
#stage-actions:empty{display:none}
.stage-action{pointer-events:auto;max-width:min(48%,240px);min-height:44px;padding:10px 15px;border:1px solid rgba(255,195,111,.58);
  border-radius:999px;background:rgba(10,13,22,.76);color:#fff2d9;font-size:13px;font-weight:800;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(12px);
  box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.08)}
.stage-action:first-child{background:linear-gradient(135deg,rgba(113,72,28,.9),rgba(31,25,24,.88));border-color:#e1a956}
.stage-action:hover{border-color:#ffd18d;transform:translateY(-1px)}
html[data-travel-state="driving"] #stage-actions,html[data-travel-state="ignition"] #stage-actions{display:none}
.journey-context{background:rgba(13,17,30,.58);box-shadow:none}
.journey-context{background:rgba(13,17,30,.58);box-shadow:none}
.journey-context-head{display:none}
.context-location,.context-crew{background:rgba(5,8,15,.22)}
.act,.route-option{box-shadow:none}

#cockpit-controls{display:none;position:absolute;inset:0;z-index:13;pointer-events:none}
html[data-travel-state="driving"] #cockpit-controls,html[data-travel-state="ignition"] #cockpit-controls{display:block}
#cockpit-controls button{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:5px;min-width:44px;min-height:44px;
  padding:7px 10px;border:1px solid rgba(222,190,126,.42);border-radius:8px;background:rgba(7,9,14,.55);
  color:#f0dfba;backdrop-filter:blur(6px);box-shadow:0 5px 16px rgba(0,0,0,.24)}
#cockpit-controls button span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(255,180,84,.13);
  color:var(--amber);font:700 12px/1 var(--mono)}
#cockpit-controls button b{font:700 11px/1.1 var(--mono);white-space:nowrap}
#cockpit-controls [data-cockpit-action="map"]{left:11%;bottom:20%}
#cockpit-controls [data-cockpit-action="ignition"]{left:50%;bottom:4%;transform:translateX(-50%);border-color:rgba(226,87,79,.62)}
#cockpit-controls [data-cockpit-action="ignition"].on{border-color:rgba(125,201,143,.75);background:rgba(27,63,40,.72);color:#c7f4cf}
#cockpit-controls [data-cockpit-action="crew"]{left:50%;top:6%;transform:translateX(-50%)}
#cockpit-controls [data-cockpit-action="status"]{left:50%;bottom:16%;transform:translateX(-50%)}
#cockpit-controls [data-cockpit-action="radio"]{right:10%;bottom:20%}
#cockpit-controls button:hover{border-color:#f4c77d;background:rgba(37,28,20,.72)}

@media(max-width:680px){
  #stage{flex-basis:clamp(290px,40dvh,370px)}
  html[data-travel-state="driving"] #stage,html[data-travel-state="ignition"] #stage{flex-basis:clamp(335px,49dvh,450px)}
  #dash{margin-top:-58px;margin-left:8px;margin-right:8px;padding-top:7px;padding-bottom:6px}
  #mission-strip{width:calc(100% - 16px);margin:7px 8px 0}
  #main{margin-top:7px;border-radius:15px 15px 0 0}
  #panel{padding:11px 12px calc(64px + var(--safe-bottom))}
  #stage-actions{left:10px;right:10px;bottom:67px;gap:6px}
  .stage-action{min-height:42px;padding:9px 12px;font-size:12.5px}
  #cockpit-controls button{padding:6px;min-width:42px;min-height:42px}
  #cockpit-controls button b{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
  #cockpit-controls [data-cockpit-action="map"]{left:8%;bottom:19%}
  #cockpit-controls [data-cockpit-action="radio"]{right:7%;bottom:19%}
}

/* ── focused cockpit layout ──────────────────────────────────
   정차 중에는 달구지와 바깥 풍경을 보여 주고, 출발한 뒤에만 앞유리와
   하나의 운전 콘솔을 쓴다. 중복 계기판과 임무 띠는 주행 중 접는다. */
html[data-travel-state="driving"] #stage,
html[data-travel-state="ignition"] #stage{

  border-bottom:1px solid rgba(218,177,105,.22);
  box-shadow:inset 0 -96px 72px -60px rgba(0,0,0,.92);
}

html[data-travel-state="ignition"] #dash,

html[data-travel-state="driving"] #main,

html[data-travel-state="driving"] #road-status-meta,
html[data-travel-state="ignition"] #road-status-meta{margin-top:3px;color:#c6cbd4;font:10px/1.25 var(--mono)}

html[data-travel-state="ignition"] #minimap{
  top:12px;right:10px;width:60px;height:74px;opacity:.88;border-color:rgba(210,175,109,.3);
  background:rgba(7,10,16,.76);box-shadow:0 7px 18px rgba(0,0,0,.25)
}

#cockpit-controls{display:none;position:absolute;inset:auto 10px 12px;z-index:13;pointer-events:auto;
  grid-template-columns:minmax(76px,1.35fr) repeat(4,minmax(48px,1fr));gap:6px;padding:8px;
  border:1px solid rgba(225,192,126,.3);border-radius:13px;
  background:linear-gradient(180deg,rgba(20,21,23,.88),rgba(7,9,12,.96));
  box-shadow:0 12px 30px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.06);
  backdrop-filter:blur(10px)
}
html[data-travel-state="driving"] #cockpit-controls,
html[data-travel-state="ignition"] #cockpit-controls{display:grid}
#cockpit-controls button{
  position:static;transform:none;pointer-events:auto;display:flex;min-width:0;min-height:52px;padding:7px 4px;
  flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border:1px solid rgba(224,207,170,.16);border-radius:8px;background:rgba(40,42,43,.62);

#cockpit-controls [data-cockpit-action="ignition"]{

}

#cockpit-controls [data-cockpit-action="map"],

/* ── selected cockpit 01: the vehicle interior is the interface ── */
#cockpit-shell,#cockpit-mirror,#cockpit-meters,#cockpit-nav{display:none}
html[data-travel-state="driving"] #stage,
html[data-travel-state="ignition"] #stage{

}

html[data-travel-state="driving"] #minimap,
html[data-travel-state="ignition"] #minimap{display:none}

html[data-travel-state="driving"] #cockpit-mirror,
html[data-travel-state="ignition"] #cockpit-mirror{
  display:flex;position:absolute;z-index:15;top:8.7%;right:2%;width:34%;height:8.6%;min-height:44px;
  flex-direction:row;align-items:center;justify-content:center;gap:6px;padding:4px 7px;
  border:0;border-radius:12px;background:transparent;color:#c9b491;box-shadow:none
}
#cockpit-crew-faces{display:flex;align-items:center;justify-content:center;gap:3px;min-width:0}
#cockpit-crew-faces img{width:clamp(34px,9vw,40px);height:clamp(34px,9vw,40px);object-fit:cover;
  border:1px solid rgba(213,174,111,.35);border-radius:6px;filter:saturate(.75) brightness(.82)}
#cockpit-mirror b{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
#cockpit-mirror:hover,#cockpit-mirror:focus-visible{outline:0;background:rgba(227,165,79,.055);
  box-shadow:inset 0 0 18px rgba(225,163,77,.12)}

html[data-travel-state="driving"] #cockpit-meters,
html[data-travel-state="ignition"] #cockpit-meters{
  display:block;position:absolute;inset:0;z-index:15;pointer-events:none
}
.cockpit-meter{
  --needle-angle:-120deg;position:absolute;top:58.1%;width:29%;height:13.3%;min-height:70px;
  padding:0;border:0;border-radius:50%;background:transparent;color:#d9ccb8;pointer-events:auto;box-shadow:none
}
#cockpit-fuel-meter{left:10.2%}#cockpit-van-meter{right:10.2%}
.cockpit-meter .cockpit-needle{
  position:absolute;z-index:2;left:50%;top:47%;width:30%;height:2px;border-radius:2px;
  background:#efb66d;box-shadow:0 0 5px rgba(239,182,109,.48);
  transform-origin:0 50%;transform:rotate(var(--needle-angle));transition:transform .45s ease
}
.cockpit-meter span,.cockpit-meter b{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.cockpit-meter.warn .cockpit-needle{background:#e86155;box-shadow:0 0 8px rgba(232,97,85,.7)}
.cockpit-meter:hover,.cockpit-meter:focus-visible{outline:0;box-shadow:inset 0 0 0 1px rgba(239,178,92,.28),
  inset 0 0 18px rgba(239,178,92,.08)}

html[data-travel-state="driving"] #cockpit-controls,
html[data-travel-state="ignition"] #cockpit-controls{
  display:block;position:absolute;inset:0;z-index:16;padding:0;border:0;border-radius:0;
  background:transparent;box-shadow:none;backdrop-filter:none;pointer-events:none
}
#cockpit-controls button{pointer-events:auto;color:#dec9a7}
#cockpit-controls [data-cockpit-action="ignition"],
#cockpit-controls [data-cockpit-action="map"],
#cockpit-controls [data-cockpit-action="radio"]{
  position:absolute;display:block;transform:none;padding:0;border:0;background:transparent;box-shadow:none
}
#cockpit-controls [data-cockpit-action="ignition"]{left:10.5%;top:80.7%;width:16%;height:7.6%;min-width:58px;min-height:58px;border-radius:50%}
#cockpit-controls [data-cockpit-action="map"]{left:32.5%;top:79.8%;width:36.5%;height:13.2%;min-height:76px;border-radius:7px}
#cockpit-controls [data-cockpit-action="radio"]{right:7.5%;top:79.8%;width:21.5%;height:13.2%;min-height:76px;border-radius:7px}
#cockpit-controls button>span,#cockpit-controls button>b{position:absolute!important;width:1px!important;height:1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important}
#cockpit-controls [data-cockpit-action="ignition"],
#cockpit-controls [data-cockpit-action="ignition"].on{background:transparent;border:0}
#cockpit-controls [data-cockpit-action="ignition"].on{box-shadow:0 0 20px rgba(111,214,133,.24),
  inset 0 0 16px rgba(111,214,133,.16)}
#cockpit-controls button:hover,#cockpit-controls button:focus-visible{
  outline:0;background:rgba(228,165,75,.045);box-shadow:inset 0 0 0 1px rgba(239,178,92,.26),
  inset 0 0 18px rgba(239,178,92,.08)
}
#cockpit-controls button:active{transform:translateY(2px) scale(.985);background:rgba(228,165,75,.09)}

html[data-travel-state="driving"] #bubbles,
html[data-travel-state="ignition"] #bubbles{z-index:22;padding-top:18%;padding-bottom:43%;pointer-events:none}
html[data-travel-state="driving"] #bubbles .bubble,
html[data-travel-state="ignition"] #bubbles .bubble{pointer-events:auto;max-width:72%;background:rgba(11,13,17,.78);backdrop-filter:blur(6px)}

@media(max-width:680px){
  html[data-travel-state="driving"] #stage,
  html[data-travel-state="ignition"] #stage{flex-basis:100dvh;min-height:100dvh;height:100dvh}
  #cockpit-controls [data-cockpit-action="ignition"],
  #cockpit-controls [data-cockpit-action="map"],
  #cockpit-controls [data-cockpit-action="radio"]{position:absolute;transform:none;min-width:0;min-height:70px}
  #cockpit-controls button b{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
}

/* ── two-view driving controls and road interaction ── */
#drive-exterior-van,#drive-controls,#drive-prompt,#drive-lanes{display:none}
html[data-travel-state="driving"] #drive-controls,
html[data-travel-state="ignition"] #drive-controls{
  display:grid;position:absolute;z-index:25;top:19%;right:8px;width:54px;gap:6px
}
#drive-controls button{
  min-width:50px;min-height:42px;padding:5px 4px;border:1px solid rgba(198,151,88,.38);
  border-radius:7px;background:linear-gradient(180deg,rgba(35,31,27,.94),rgba(13,14,16,.94));
  color:#d9c5a4;box-shadow:inset 0 1px rgba(255,255,255,.05),0 3px 10px rgba(0,0,0,.32)
}
#drive-controls button span{display:block;color:#8f7859;font:700 7px/1 var(--mono);letter-spacing:.08em}
#drive-controls button b{display:block;margin-top:4px;font:800 10px/1 var(--mono)}
#drive-controls button.active{border-color:rgba(107,200,135,.62);color:#bde9c8;
  box-shadow:inset 0 0 14px rgba(77,180,111,.12),0 0 10px rgba(77,180,111,.1)}
#drive-controls button:active{transform:translateY(1px)}
#drive-prompt{
  position:absolute;z-index:28;top:20%;left:50%;width:min(68%,270px);transform:translateX(-50%);
  flex-direction:column;gap:3px;padding:9px 12px;border:1px solid rgba(231,164,72,.65);
  border-radius:8px;background:rgba(10,12,16,.9);color:#f0d5aa;text-align:center;
  box-shadow:0 10px 28px rgba(0,0,0,.4),inset 0 0 18px rgba(222,139,51,.07)
}
#drive-prompt.on{display:flex;animation:hazard-in .18s ease-out both}
#drive-prompt small{color:#df9550;font:800 8px/1 var(--mono);letter-spacing:.16em}
#drive-prompt b{font:800 13px/1.25 var(--sans)}
#drive-prompt span{color:#b6aa97;font:700 10px/1.25 var(--sans)}
#drive-lanes{
  position:absolute;z-index:29;left:7px;right:7px;bottom:34%;align-items:center;justify-content:space-between;
  pointer-events:none
}
#drive-lanes.on{display:flex}
#drive-lanes button{pointer-events:auto;min-width:96px;min-height:52px;padding:8px 10px;border:1px solid rgba(231,164,72,.55);
  border-radius:9px;background:rgba(10,12,16,.84);color:#f0d5aa;font:800 11px/1 var(--sans);
  box-shadow:0 5px 18px rgba(0,0,0,.35)}
@keyframes hazard-in{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}

html[data-drive-view="exterior"][data-travel-state="driving"] #cockpit-shell,
html[data-drive-view="exterior"][data-travel-state="ignition"] #cockpit-shell,
html[data-drive-view="exterior"][data-travel-state="driving"] #cockpit-mirror,
html[data-drive-view="exterior"][data-travel-state="ignition"] #cockpit-mirror,
html[data-drive-view="exterior"][data-travel-state="driving"] #cockpit-meters,
html[data-drive-view="exterior"][data-travel-state="ignition"] #cockpit-meters,
html[data-drive-view="exterior"][data-travel-state="driving"] #cockpit-controls,
html[data-drive-view="exterior"][data-travel-state="ignition"] #cockpit-controls{display:none!important}
html[data-drive-view="exterior"][data-travel-state="driving"] #cv,
html[data-drive-view="exterior"][data-travel-state="ignition"] #cv{top:0;height:100%!important}
html[data-drive-view="exterior"][data-travel-state="driving"] #drive-exterior-van,
html[data-drive-view="exterior"][data-travel-state="ignition"] #drive-exterior-van{
  display:block;position:absolute;z-index:12;left:50%;bottom:5%;width:min(72%,430px);height:auto;
  transform:translateX(-50%);transform-origin:50% 90%;pointer-events:none;
  filter:drop-shadow(0 18px 18px rgba(0,0,0,.55))
}
html[data-drive-view="exterior"][data-travel-state="driving"] #drive-exterior-van{
  animation:exterior-ride 1.6s ease-in-out infinite alternate
}
html[data-drive-pace="eco"] #drive-exterior-van{animation-duration:2.1s!important}
html[data-drive-pace="push"] #drive-exterior-van{animation-duration:.9s!important}
@keyframes exterior-ride{
  from{transform:translateX(-50%) translateY(0) rotate(-.15deg)}
  to{transform:translateX(-50%) translateY(3px) rotate(.18deg)}
}
html[data-drive-view="exterior"] #cockpit-nav{
  top:3%!important;left:3%!important;width:58%!important;height:auto!important;padding:9px 11px!important;
  border:1px solid rgba(192,145,82,.35)!important;border-radius:8px!important;
  background:rgba(9,12,17,.82)!important;box-shadow:0 8px 22px rgba(0,0,0,.3)!important
}
html[data-drive-view="exterior"] #drive-controls{top:3%;grid-template-columns:repeat(2,50px);width:106px}

/* ── stop actions and vehicle systems ── */
.stop-action-console,.vehicle-console{position:relative;padding:12px;border:1px solid #2c394d;border-radius:10px;
  overflow:hidden;background:linear-gradient(145deg,rgba(18,25,40,.98),rgba(8,13,23,.98));
  box-shadow:inset 0 1px rgba(255,255,255,.025),0 7px 18px rgba(0,0,0,.18)}
.stop-action-console:before,.vehicle-console:before{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,183,80,.56),transparent)}
.stop-console-head,.vehicle-console-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.stop-console-head>span,.vehicle-console-head>span{min-width:0}
.stop-console-head small,.vehicle-console-head small{display:block;color:#da9d49;font:800 9px/1.2 var(--mono);letter-spacing:.13em}
.stop-console-head b,.vehicle-console-head b{display:block;margin-top:3px;color:#edf0ed;font-size:15px;line-height:1.25}
.stop-console-head p,.vehicle-console-head p{margin:3px 0 0;color:#8290a3;font:10.5px/1.35 var(--mono)}
.stop-console-head>em{flex:none;margin-top:1px;padding:4px 7px;border:1px solid rgba(107,200,192,.3);border-radius:3px;
  color:#70c8c1;background:rgba(42,107,105,.11);font:800 9px/1.2 var(--mono);font-style:normal}
.stop-action-grid{display:grid;gap:7px}
.stop-action-card.act{display:grid;grid-template-columns:34px minmax(0,1fr);align-items:start;min-height:102px;padding:10px;
  border-radius:5px;border-color:#344158;background:rgba(11,18,30,.9);box-shadow:inset 0 0 0 1px rgba(255,255,255,.012)}
.stop-action-card.act:hover{border-color:#65748c;background:#111c2d}
.stop-action-card.act.primary{border-color:#695334;background:linear-gradient(110deg,rgba(171,110,37,.18),rgba(12,20,33,.94) 52%)}
.stop-action-card .stop-action-icon{display:grid;place-items:center;width:32px;height:32px;border:1px solid rgba(255,184,84,.24);
  border-radius:3px;background:#171b22}
.stop-action-card .stop-action-icon .ico{width:24px;height:24px;object-fit:contain;image-rendering:pixelated}
.stop-action-copy{display:block;min-width:0}.stop-action-card .stop-action-kicker{margin:0 0 2px;color:#6fc9c1;
  font:800 9px/1.15 var(--mono);letter-spacing:.07em;text-transform:uppercase}
.stop-action-card b{color:#e8e9e3;font-size:13px;line-height:1.3}
.stop-action-description{display:block;margin-top:3px;color:#97a3b5;font:10.5px/1.4 var(--mono)}
.stop-action-chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.stop-action-chips i{display:inline-flex;align-items:center;min-height:20px;padding:3px 6px;border:1px solid #35445a;border-radius:2px;
  color:#aeb8c7;background:#0b1320;font:800 8.5px/1 var(--mono);font-style:normal}
.stop-action-chips .tone-ready{color:#92d8ad;border-color:rgba(91,190,136,.38)}
.stop-action-chips .tone-caution{color:#edbd70;border-color:rgba(222,154,61,.43)}
.stop-action-chips .tone-danger{color:#ef8e82;border-color:rgba(222,91,78,.48)}
.stop-action-chips .tone-muted{color:#778499}

.vehicle-console-head{align-items:center}
.vehicle-console-head>button{flex:none;min-width:88px;min-height:44px;padding:7px 10px;border:1px solid #45616e;border-radius:3px;
  background:#0d2028;color:#7bd1ca;font:800 10px/1.1 var(--mono)}
.vehicle-console-head>button:hover{border-color:#78c9c2;background:#12303a}
.vehicle-console-head>button:focus-visible{outline:2px solid #91ddd5;outline-offset:2px}
.vehicle-system-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.vehicle-system-card{display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:auto auto auto;gap:1px 5px;min-width:0;
  padding:8px 7px;border:1px solid #334158;border-radius:4px;background:rgba(8,15,26,.86)}
.vehicle-system-icon{grid-row:1/3;display:grid;place-items:center;width:20px;height:20px}
.vehicle-system-icon .ico{width:19px;height:19px;object-fit:contain;image-rendering:pixelated}
.vehicle-system-card small{min-width:0;color:#75879c;font:800 8.5px/1.1 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vehicle-system-card b{min-width:0;color:#e8e9e2;font:850 12px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vehicle-system-card em{grid-column:1/3;min-width:0;margin-top:4px;color:#8f9cad;font:8.5px/1.25 var(--mono);font-style:normal;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vehicle-system-card.system-ready{border-color:rgba(78,151,116,.42)}
.vehicle-system-card.system-caution{border-color:rgba(212,148,63,.5)}
.vehicle-system-card.system-danger{border-color:rgba(213,82,72,.58)}
.vehicle-system-card.system-danger b{color:#f0988d}.vehicle-system-card.system-caution b{color:#ebc078}
.vehicle-console-tools{display:grid;gap:9px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,180,84,.18)}
.vehicle-console-tools .van-build-summary{margin:0}
.vehicle-module-list{display:grid;grid-template-columns:70px minmax(0,1fr);gap:8px;align-items:start}
.vehicle-module-list>small{padding-top:5px;color:#7e8ca0;font:800 9px/1.2 var(--mono);letter-spacing:.06em}
.vehicle-module-list>div{display:flex;flex-wrap:wrap;gap:4px}.vehicle-module-list i{padding:4px 6px;border:1px solid #3a4658;border-radius:2px;
  color:#b8c2ce;background:#101725;font:8.5px/1.1 var(--mono);font-style:normal}
.vehicle-module-list span,.vehicle-tools-empty{margin:0;color:#818da0;font:10px/1.4 var(--mono)}
.vehicle-console .utility-actions{grid-template-columns:1fr;gap:6px}
.vehicle-console .utility-actions .act{min-height:52px;border-radius:4px;background:#101827}
.vehicle-console .utility-actions .ic .ico{width:20px;height:20px;object-fit:contain;image-rendering:pixelated}
html[data-journey-stage="first"] .route-rumor-section{display:none}
.ms-secondary-wrap .ms-chip:nth-of-type(n+3){display:none}

/* ── concise choices and companion continuity ── */
.choice-intent{display:inline-flex;align-items:center;margin-right:7px;padding:3px 6px;border:1px solid rgba(73,196,183,.4);
  border-radius:999px;color:#76d7ce;font:800 8px/1 var(--mono);font-style:normal;letter-spacing:.04em}
.crew-presence{border-color:rgba(91,193,173,.35)!important;background:rgba(21,55,53,.26)!important}
.crew-presence b{display:block;color:#81d4c7!important}
.event-choice-dock .choice[disabled]{min-height:44px;padding-top:8px;padding-bottom:8px;opacity:.46}
.event-choice-dock .choice[disabled] .combat-response,
.event-choice-dock .choice[disabled] .combat-odds,
.event-choice-dock .choice[disabled] .risk{display:none}
.event-choice-dock .choice[disabled] .req{margin-top:3px}

@media(max-width:680px){
  html[data-travel-state="driving"] #drive-controls,
  html[data-travel-state="ignition"] #drive-controls{right:6px;gap:4px}
  #drive-controls button{min-width:46px;min-height:40px}
  html[data-drive-view="exterior"] #drive-controls{grid-template-columns:repeat(2,46px);width:96px}
  #drive-lanes{bottom:31%}
}
@media(prefers-reduced-motion:reduce){
  #drive-exterior-van,#drive-prompt{animation:none!important}
}

/* ── road-first navigation ──────────────────────────────────
   The stopped screen is the play surface. Objectives, map, inventory and
   secondary utilities stay one tap away instead of competing with the road. */
#mission-strip{display:none}
#stage{flex-basis:clamp(235px,32dvh,280px)}
#dash{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;z-index:11;
  margin:-46px 10px 0;padding:8px 10px;border:1px solid rgba(232,227,213,.16);border-radius:12px;
  background:linear-gradient(180deg,rgba(9,12,21,.76),rgba(10,14,25,.96));
  box-shadow:0 12px 28px rgba(0,0,0,.32);backdrop-filter:blur(12px)}
#gauges{grid-template-columns:repeat(2,minmax(0,1fr))}
#gauges .g{padding:0 10px}
#gauges .g:nth-child(2),#gauges .g:nth-child(3),#gauges .g:nth-child(5){display:none}
#dash-sub{min-width:112px;display:grid;justify-items:end;gap:3px;margin:0;padding:0 0 0 10px;
  border-top:0;border-left:1px solid rgba(255,255,255,.07);line-height:1.25}
#dash-sub #ftgbox,#dash-sub #eyebox{display:none!important}
#main{--nav-deck-h:clamp(76px,19.68vw,134px);margin-top:8px}
#panel{padding-top:10px;padding-bottom:calc(var(--nav-deck-h) + 8px + var(--safe-bottom))}
#panel>.journey-context{display:none}
#panel>.journey-guide{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 10px;
  margin:0 0 10px;padding:8px 10px}
#panel>.journey-guide .journey-guide-head{grid-column:1/3;margin:0}
#panel>.journey-guide>b{grid-column:1;font-size:13px}
#panel>.journey-guide>p,#panel>.journey-guide>.journey-guide-list{display:none}
#panel>.journey-guide .journey-guide-track{grid-column:1/3;margin-top:2px}
.journey-section{margin-bottom:12px}
.journey-section-head{margin-bottom:7px}

#dock{height:calc(var(--nav-deck-h) + var(--safe-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));
  align-items:stretch;gap:0;padding:0 0 var(--safe-bottom);overflow:visible;isolation:isolate;
  background:transparent;border-top:0;box-shadow:none;backdrop-filter:none}
#dock::before{content:"";position:absolute;z-index:0;left:0;right:0;bottom:var(--safe-bottom);height:var(--nav-deck-h);
  background:url("__UI_NAV_ARMORED_SHELL__") center bottom/100% 100% no-repeat;pointer-events:none;
  filter:drop-shadow(0 -8px 13px rgba(0,0,0,.34))}
#dock button{--press-depth:0px;--visual-x:0%;position:relative;z-index:1;isolation:isolate;min-width:0;min-height:var(--nav-deck-h);
  padding:27% 0 5.5%;gap:1px;border:0;border-radius:0;
  background:transparent;color:#c7c4bb;font:700 clamp(12px,2vw,14px)/1.05 var(--mono);letter-spacing:.01em;
  box-shadow:none;transition:color .1s ease}
#dock button:nth-child(1){--visual-x:12.2%}
#dock button:nth-child(2){--visual-x:5.45%}
#dock button:nth-child(3){--visual-x:-3.2%}
#dock button:nth-child(4){--visual-x:-9.3%}
#dock button:nth-child(5){--visual-x:-15.4%}
#dock button::before{content:"";position:absolute;z-index:0;left:12%;width:76%;margin-left:var(--visual-x);top:25.5%;
  bottom:4.5%;background:url("__UI_NAV_BUTTON_FACE__") center/100% 100% no-repeat;
  filter:brightness(.88) saturate(.72);transform:translateY(var(--press-depth));
  transition:transform .09s ease,filter .09s ease}
#dock button>*{position:relative;z-index:2;left:var(--visual-x);transform:translateY(var(--press-depth));transition:transform .09s ease}
#dock button .dic{width:clamp(19px,4vw,26px);height:clamp(19px,4vw,26px);display:grid;place-items:center;filter:none}
#dock button .dic img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;opacity:.82;
  filter:grayscale(.75) sepia(.15) brightness(1.22);transition:filter .1s ease,transform .1s ease}
#dock button.here{color:#ffbd62;box-shadow:none}
#dock button.here .dic img{opacity:1;filter:grayscale(.3) sepia(.72) saturate(1.8) brightness(1.28)
  drop-shadow(0 0 5px rgba(255,174,72,.4))}
#dock button:active{--press-depth:4px}
#dock button:active::before{background-image:url("__UI_NAV_BUTTON_PRESSED__");filter:brightness(.52) saturate(.72)}
#dock button:focus-visible{outline:0}
#dock button:focus-visible>span:last-child{text-shadow:0 0 7px rgba(255,208,138,.62)}
#dock button:focus-visible .dic img{opacity:1;filter:grayscale(.28) sepia(.5) saturate(1.35) brightness(1.3)
  drop-shadow(0 0 5px rgba(255,208,138,.45))}

/* ── diegetic destination navigator ──────────────────────────
   The housing is raster art. Everything inside the screen is live route data. */
#panel:has(.route-console)>.journey-guide{display:none}
.route-console-section{margin:0 0 12px}
.route-console{position:relative;width:100%;aspect-ratio:3/2;overflow:hidden;
  background:url("__UI_ROUTE_CONSOLE_SHELL__") center/100% 100% no-repeat;
  filter:drop-shadow(0 10px 18px rgba(0,0,0,.32))}
.route-console-screen{position:absolute;inset:10.5% 8.9% 10.7%;min-width:0;min-height:0;display:grid;
  grid-template-columns:minmax(0,1.36fr) minmax(174px,1fr);overflow:hidden;border:1px solid rgba(91,121,148,.25);
  background:rgba(5,11,21,.96);box-shadow:inset 0 0 22px rgba(0,0,0,.62);font-family:var(--mono)}
.nav-route-map{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:9px 9px 7px;
  border-right:1px solid rgba(94,116,143,.25)}
.nav-screen-kicker{display:flex;align-items:center;justify-content:space-between;gap:7px;color:#74aeba;
  font:700 10px/1.2 var(--mono);letter-spacing:.06em;white-space:nowrap}
.nav-screen-kicker span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav-screen-kicker em{flex:none;color:#52647d;font-style:normal;font-size:9px;letter-spacing:.1em}
.nav-route-map canvas{display:block;width:100%;height:100%;min-height:0}
.nav-map-legend{display:flex;align-items:center;gap:9px;color:#7890a4;font:9px/1.25 var(--mono);white-space:nowrap}
.nav-map-legend span:first-child{color:#ffc16b}.nav-map-legend span:nth-child(2){color:#6cc9c2}
.nav-map-legend .danger{color:#ef6d62}

.nav-route-decision{min-width:0;min-height:0;display:flex;flex-direction:column;padding:8px 9px 7px;overflow:hidden}
.nav-destination-head{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:28px;color:#8497ad;
  font:700 9px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase}
.nav-destination-tabs{display:flex;align-items:center;gap:3px;max-width:100%;overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.nav-destination-tabs::-webkit-scrollbar{display:none}
.nav-destination-tab.route-option{display:grid;place-items:center;width:44px;min-width:44px;height:44px;min-height:44px;padding:0;
  border:1px solid #33445a;border-radius:2px;background:#0c1623;color:#8295a8;font:800 10px/1 var(--mono);
  grid-template-columns:1fr;overflow:hidden;box-shadow:none;animation:route-card-in .2s both}
.nav-destination-tab.route-option::after{content:none}
.nav-destination-tab.route-option.is-selected{border-color:#d79b43;background:#392712;color:#ffc16b;
  box-shadow:inset 0 0 0 1px rgba(255,193,107,.14)}
.nav-destination-tab.route-option:focus-visible{outline:2px solid #80d5cf;outline-offset:1px}
.nav-destination-title{display:grid;grid-template-columns:minmax(0,1fr);align-items:center;gap:5px;border-bottom:1px solid rgba(255,180,84,.22)}
.nav-route-decision h3{margin:4px 0 3px;padding-bottom:4px;border:0;
  color:#ffba59;font:800 clamp(13px,2.45vw,18px)/1.22 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-console-body{display:flex;flex:1;min-height:0;flex-direction:column}
.nav-arrival-note{min-height:17px;margin:3px 0 2px;color:#8c9bad;font:8.5px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-arrival-note span{color:#6bc8c0;font-weight:800}
.nav-known-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin:3px 0 4px}
.nav-known-facts>span{display:grid;align-content:center;min-width:0;min-height:35px;padding:4px 5px;border:1px solid rgba(85,199,190,.2);
  background:rgba(9,31,39,.62)}
.nav-known-facts small{color:#6ebeb8;font:700 7.5px/1.15 var(--mono);white-space:nowrap}
.nav-known-facts b{margin-top:2px;color:#dbe1e6;font:800 8.5px/1.15 var(--mono);overflow-wrap:anywhere}
.nav-unknown-list{display:grid;flex:1;min-height:0;align-content:center;gap:2px}
.nav-unknown-list>span{display:grid;grid-template-columns:7px minmax(0,1fr) auto;align-items:center;gap:5px;min-height:19px;padding:2px 4px;
  border-left:1px solid rgba(121,143,165,.34);background:rgba(21,29,42,.58);color:#aeb8c4}
.nav-unknown-list i{width:5px;height:5px;border:1px solid #708399;border-radius:50%}
.nav-unknown-list b{font:700 8.5px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-unknown-list small{color:#68788c;font:7.5px/1.15 var(--mono);white-space:nowrap}
.nav-hazard-list{display:grid;width:100%;gap:3px;min-height:75px;padding:0;border:0;border-radius:2px;background:transparent;text-align:left;cursor:pointer}
.nav-hazard-list:hover{background:rgba(96,198,190,.07)}.nav-hazard-list:focus-visible{outline:1px solid #80d5cf;outline-offset:1px}
.nav-hazard-row{display:grid;width:100%;grid-template-columns:minmax(0,1fr) 52px 30px;align-items:center;gap:5px;min-height:25px;padding:0;
  border:0;border-radius:1px;background:transparent;color:#bcc5d1;text-align:left}
.nav-hazard-row>span{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:4px}
.nav-hazard-row b{min-width:0;font:700 10px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-hazard-row small{color:#8795a8;font:8px/1 var(--mono)}
.nav-hazard-row em{color:#aeb7c3;font:9px/1 var(--mono);font-style:normal;text-align:right}
.nav-risk-meter{display:block;height:6px;background:#2b3440;overflow:hidden;font-style:normal}
.nav-risk-meter u{display:block;height:100%;background:#6bbcb4;text-decoration:none}
.nav-hazard-row.risk-mid .nav-risk-meter u{background:#d69a42}.nav-hazard-row.risk-mid em{color:#e3ad5c}
.nav-hazard-row.risk-high .nav-risk-meter u{background:#de5b52}.nav-hazard-row.risk-high em{color:#ef756a}
.nav-supply-impact{display:grid;margin:4px 0 0;padding:3px 0;border-top:1px solid rgba(255,180,84,.16);border-bottom:1px solid rgba(255,180,84,.16)}
.nav-supply-impact>button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:6px;min-height:44px;padding:3px 0;
  border:0;border-radius:1px;background:transparent;color:#aeb7c5;font:9.5px/1.2 var(--mono);text-align:left;cursor:pointer}
.nav-supply-impact>button:hover{background:rgba(255,180,84,.06)}.nav-supply-impact>button:focus-visible{outline:1px solid #ffc16b;outline-offset:1px}
.nav-supply-impact>button span,.nav-supply-impact>button em{display:flex;align-items:center;gap:3px}.nav-supply-impact .ico{width:14px;height:14px}
.nav-supply-impact>button em{color:#c9d0d9;font-style:normal;white-space:nowrap}.nav-supply-impact strong{color:#ff765f;font-weight:850}
.nav-inspector{display:flex;min-height:0;flex:1;flex-direction:column;padding-top:4px;color:#aeb8c5;font-family:var(--mono)}
.nav-inspector-back{align-self:flex-start;min-height:44px;margin:0 0 2px;padding:2px 6px;border:1px solid #31515d;border-radius:2px;
  background:#0a1b23;color:#68c3bd;font:800 8.5px/1 var(--mono)}
.nav-inspector>small{color:#da9d49;font:800 8px/1.2 var(--mono);letter-spacing:.04em}
.nav-inspector>b{margin-top:2px;color:#e6ebef;font:850 12px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-inspector>p{display:-webkit-box;overflow:hidden;margin:3px 0;color:#8f9dad;font:8.5px/1.35 var(--mono);-webkit-box-orient:vertical;-webkit-line-clamp:2}
.nav-inspector dl{display:grid;gap:3px;margin:2px 0 0}.nav-inspector dl>div{display:grid;grid-template-columns:28px minmax(0,1fr);gap:5px}
.nav-inspector dt,.nav-inspector dd{margin:0;font:8.5px/1.25 var(--mono)}.nav-inspector dt{color:#6bc8c0;font-weight:800}
.nav-inspector dd{color:#bdc6d0}.nav-inspector dl>div:last-child dd{color:#f0c179}
.nav-time{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:27px;color:#6ecdc3;font:9.5px/1.2 var(--mono)}
.nav-time b{font:800 10px/1.2 var(--mono);white-space:nowrap}.nav-time span{color:#9ca8b7;font-size:9px;white-space:nowrap}
.nav-console-actions{display:grid;grid-template-columns:minmax(58px,.78fr) minmax(76px,1.22fr);gap:5px;margin-top:auto}
.nav-console-actions button{min-width:0;min-height:44px;padding:5px 7px;border:1px solid #38636b;border-radius:2px;
  background:#0b2027;color:#7bd1ca;font:800 11px/1.1 var(--mono);white-space:nowrap}
.nav-console-actions [data-nav-depart]{border-color:#ffc16b;background:#9a621d;color:#fff0cf;font-size:12px;
  box-shadow:inset 0 0 0 1px rgba(255,220,156,.18)}
.nav-console-actions .nav-resource-fix{border-color:#d96b59;background:#5a2521;color:#ffb5a9;font-size:9.5px;white-space:normal}
.nav-console-actions button:hover{filter:brightness(1.12)}.nav-console-actions button:active{transform:translateY(1px)}
.nav-console-actions button:focus-visible{outline:2px solid #ffe0a3;outline-offset:1px}
.nav-console-actions button[disabled]{opacity:.38;filter:grayscale(.45)}
.nav-depart-blocked{display:block;margin-top:3px;color:#e67b6d;font:8.5px/1.2 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── one fixed stop console: route / local / vehicle ─────────
   The same physical terminal owns all stopped-state decisions. Switching a
   tab replaces the screen instead of stacking another long panel below it. */
.journey-mode-console{position:relative;margin:0 0 12px}
.journey-mode-tabs{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;
  min-height:68px;margin:0 0 -4px;padding:10px 8.5% 12px;
  background:url("__UI_ROUTE_CONSOLE_SHELL__") center 3%/100% 360% no-repeat;
  filter:drop-shadow(0 7px 12px rgba(0,0,0,.34))}
.journey-mode-tabs button{position:relative;min-width:0;min-height:46px;padding:5px 8px;border:0;
  background:url("__UI_NAV_BUTTON_FACE__") center/100% 100% no-repeat;color:#a8a7a1;
  font:850 clamp(13px,3.2vw,18px)/1 var(--sans);text-shadow:0 2px 2px #000;cursor:pointer}
.journey-mode-tabs button[aria-selected="true"]{background-image:url("__UI_NAV_BUTTON_PRESSED__");color:#ffc063;
  text-shadow:0 0 8px rgba(255,181,78,.34),0 2px 2px #000}
.journey-mode-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:20%;right:20%;bottom:5px;height:2px;
  background:#e9a13d;box-shadow:0 0 7px rgba(255,174,64,.72)}
.journey-mode-tabs button:focus-visible{outline:2px solid #ffe0a3;outline-offset:1px}
.journey-mode-panel{margin-top:0}
.journey-mode-panel .route-console-screen{font-family:var(--mono)}
.journey-local-screen.stop-action-console,.journey-vehicle-screen.vehicle-console{position:absolute;inset:10.5% 8.9% 10.7%;
  display:flex;min-width:0;min-height:0;flex-direction:column;padding:11px 12px;border:1px solid rgba(91,121,148,.25);
  border-radius:0;overflow:hidden;background:#050b15;box-shadow:inset 0 0 22px rgba(0,0,0,.62)}
.journey-local-screen.stop-action-console::before,.journey-vehicle-screen.vehicle-console::before{content:none}
.journey-mode-heading{display:flex;flex:none;align-items:flex-start;justify-content:space-between;gap:9px;padding-bottom:8px;
  border-bottom:1px solid rgba(255,180,84,.22)}
.journey-mode-heading>span{min-width:0}.journey-mode-heading small{display:block;color:#da9d49;font:800 12px/1.2 var(--mono);letter-spacing:.1em}
.journey-mode-heading b{display:block;margin-top:2px;color:#f0eee7;font:850 15px/1.22 var(--sans)}
.journey-mode-heading p{margin:2px 0 0;color:#7f8da0;font:12px/1.3 var(--mono)}
.journey-mode-heading>em{flex:none;padding:4px 6px;border:1px solid rgba(85,199,190,.35);color:#6fc8c0;
  background:#0a2429;font:800 12px/1 var(--mono);font-style:normal}
.journey-local-screen .stop-action-grid{display:grid;flex:1;min-height:0;align-content:start;gap:0;overflow-y:auto;overscroll-behavior:contain}
.journey-local-screen .stop-action-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(108px,.72fr);align-items:center;gap:9px;
  min-width:0;padding:9px 0;border-bottom:1px solid rgba(112,127,147,.27)}
.journey-local-screen .stop-action-card.is-disabled{opacity:.48}
.journey-local-screen .stop-action-copy{min-width:0}.journey-local-screen .stop-action-kicker{color:#58c3bb;font-size:12px}
.journey-local-screen .stop-action-copy>b{display:block;margin-top:2px;color:#eeb04f;font:850 13px/1.2 var(--sans)}
.journey-local-screen .stop-action-description{display:-webkit-box;margin-top:3px;overflow:hidden;color:#a0a9b7;font:12px/1.35 var(--mono);
  -webkit-box-orient:vertical;-webkit-line-clamp:2}
.journey-local-screen .stop-action-chips{gap:3px;margin-top:5px}.journey-local-screen .stop-action-chips i{min-height:22px;padding:3px 5px;font-size:12px}
.stop-action-trigger{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;gap:5px;min-width:0;min-height:58px;padding:7px 8px;border:0;
  background:url("__UI_NAV_BUTTON_FACE__") center/100% 100% no-repeat;color:#e8e2d5;text-align:left;cursor:pointer}
.stop-action-card.primary .stop-action-trigger{background-image:url("__UI_NAV_BUTTON_PRESSED__");color:#ffc063}
.stop-action-trigger:hover{filter:brightness(1.13)}.stop-action-trigger:active{transform:translateY(1px)}
.stop-action-trigger:focus-visible{outline:2px solid #ffe0a3;outline-offset:-2px}.stop-action-trigger[disabled]{cursor:not-allowed}
.stop-action-trigger .stop-action-icon{width:28px;height:28px;border:0;background:transparent}.stop-action-trigger .stop-action-icon .ico{width:24px;height:24px}
.stop-action-trigger>span:last-child{min-width:0}.stop-action-trigger b{display:block;color:inherit;font:850 13px/1.18 var(--sans);white-space:normal}
.stop-action-trigger small{display:block;margin-top:3px;color:#8e99aa;font:12px/1.1 var(--mono)}
.local-action-summary{display:grid;flex:none;grid-template-columns:repeat(3,minmax(0,1fr));min-height:46px;margin-top:7px;padding:6px 0;
  border-top:1px solid rgba(255,180,84,.25);border-bottom:1px solid rgba(255,180,84,.18)}
.local-action-summary>span{min-width:0;padding:0 7px;border-right:1px solid rgba(255,180,84,.19);text-align:center}
.local-action-summary>span:last-child{border-right:0}.local-action-summary small{display:block;color:#748196;font:12px/1.15 var(--mono)}
.local-action-summary b{display:block;margin-top:4px;overflow:hidden;color:#d8d2c5;font:800 12px/1.15 var(--mono);white-space:nowrap;text-overflow:ellipsis}
.local-action-summary>span:nth-child(2) b{color:#69c9c0}.local-action-summary>span:first-child b{color:#f2bd6c}
.journey-system-strip{display:grid;flex:none;grid-template-columns:repeat(3,minmax(0,1fr));min-height:34px;padding-top:5px}
.journey-system-strip>span{display:grid;grid-template-columns:16px auto 1fr;align-items:center;gap:3px;min-width:0;padding:0 6px;
  border-right:1px solid rgba(111,127,148,.3)}
.journey-system-strip>span:last-child{border-right:0}.journey-system-strip .ico{width:14px;height:14px;object-fit:contain;image-rendering:pixelated}
.journey-system-strip small{color:#8792a3;font:12px/1 var(--mono)}.journey-system-strip b{justify-self:end;color:#d7d6d0;font:850 12px/1 var(--mono)}
.journey-vehicle-screen.vehicle-console{overflow-y:auto;overscroll-behavior:contain}
.journey-vehicle-screen .vehicle-console-head{flex:none;margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid rgba(255,180,84,.2)}
.journey-vehicle-screen .vehicle-system-grid{flex:none}
.journey-vehicle-screen .vehicle-console-tools{flex:none;margin-top:9px;padding-top:9px}
.journey-vehicle-screen .vehicle-module-list{grid-template-columns:60px minmax(0,1fr)}

@media(max-width:520px){
  .route-console{aspect-ratio:1.15}
  .route-console-screen{inset:9.6% 8.6% 10%;grid-template-columns:minmax(0,1fr) minmax(146px,1fr)}
  .nav-route-map{padding:7px 6px 6px}.nav-route-decision{padding:6px 6px 5px}
  .nav-screen-kicker em,.nav-map-legend span:nth-child(2){display:none}.nav-map-legend{gap:6px;font-size:8px}
  .nav-destination-head{flex:none;min-height:44px}.nav-destination-head>span{display:none}.nav-destination-tabs{width:100%;justify-content:flex-start}
  .nav-destination-title{gap:3px}.nav-route-decision h3{margin:1px 0;padding-bottom:1px;font-size:12px}
  .nav-arrival-note{display:none}
  .nav-hazard-list{gap:0;min-height:54px}.nav-hazard-row{grid-template-columns:minmax(0,1fr) 25px;gap:3px;min-height:18px}
  .nav-hazard-row small,.nav-risk-meter{display:none}.nav-hazard-row b{font-size:8.5px}.nav-hazard-row em{font-size:8px}
  .nav-supply-impact{margin-top:1px;padding:1px 0}.nav-supply-impact>button{min-height:44px;font-size:7.5px}
  .nav-supply-impact .ico{width:11px;height:11px}
  .nav-inspector{padding-top:2px}.nav-inspector-back{min-height:44px;margin-bottom:1px;font-size:7.5px}
  .nav-inspector>small{font-size:7px}.nav-inspector>b{font-size:10px}.nav-inspector>p{margin:1px 0;font-size:7.5px;-webkit-line-clamp:2}
  .nav-inspector dl{gap:1px;margin-top:1px}.nav-inspector dl>div{grid-template-columns:22px minmax(0,1fr);gap:3px}.nav-inspector dt,.nav-inspector dd{font-size:7.25px}
  .nav-time{min-height:19px}.nav-time b{font-size:8.5px}.nav-time span{display:none}
  .nav-console-actions{grid-template-columns:1fr 1fr;gap:3px}.nav-console-actions button{padding:4px;font-size:9px}
  .nav-console-actions [data-nav-depart]{font-size:10px}
  .journey-mode-tabs{min-height:62px;padding:8px 8% 10px}.journey-mode-tabs button{min-height:44px;font-size:14px}
  .journey-mode-panel{aspect-ratio:1.08}
  .journey-local-screen.stop-action-console,.journey-vehicle-screen.vehicle-console{inset:9.6% 8.6% 10%;padding:8px 9px}
  .journey-mode-heading{padding-bottom:6px}.journey-mode-heading p{display:none}
  .journey-local-screen .stop-action-card{grid-template-columns:minmax(0,1fr) minmax(96px,.7fr);gap:6px;padding:6px 0}
  .journey-local-screen .stop-action-kicker,.journey-local-screen .stop-action-chips,.stop-action-trigger small{display:none}
  .stop-action-trigger{grid-template-columns:23px minmax(0,1fr);min-height:52px;padding:6px}.stop-action-trigger .stop-action-icon{width:23px;height:23px}
  .stop-action-trigger .stop-action-icon .ico{width:20px;height:20px}.stop-action-trigger b{font-size:12px}
  .local-action-summary{min-height:52px;margin-top:5px;padding:5px 0}.local-action-summary b{font-size:12px}
  .journey-system-strip{min-height:29px;padding-top:4px}.journey-system-strip>span{grid-template-columns:14px auto 1fr;padding:0 4px}
  .journey-system-strip .ico{width:12px;height:12px}.journey-system-strip small,.journey-system-strip b{font-size:12px}
}

/* ── stopped-state console correction ───────────────────────
   Keep the proven destination navigator at its original geometry. The thin
   switcher only chooses the screen; local and vehicle detail use one shell
   and hand longer lists to full-screen drawers. */
.journey-mode-tabs{z-index:3;min-height:44px;margin:0 8.9% 6px;padding:0;gap:0;border:1px solid #414a55;
  background:#11161d;filter:drop-shadow(0 5px 9px rgba(0,0,0,.32))}
.journey-mode-tabs button{min-height:44px;padding:5px 8px;border:0;border-right:1px solid #353e49;
  background:#151a21;color:#9fa6ad;font:850 13px/1 var(--sans);text-shadow:0 1px 2px #000}
.journey-mode-tabs button:last-child{border-right:0}
.journey-mode-tabs button[aria-selected="true"]{background:#282117;color:#ffc063;text-shadow:0 0 8px rgba(255,181,78,.26),0 1px 2px #000}
.journey-mode-tabs button[aria-selected="true"]::after{left:12px;right:12px;bottom:0;height:2px}

.journey-mode-panel{margin-top:0;aspect-ratio:auto}
.journey-local-panel,.journey-vehicle-panel{aspect-ratio:3/2}
.journey-local-screen.stop-action-console,.journey-vehicle-screen.vehicle-console{inset:9.6% 8.6% 10%;padding:9px 10px;overflow:hidden}
.journey-mode-heading{gap:7px;padding-bottom:6px}
.journey-mode-heading small{font-size:10px}
.journey-mode-heading b{font-size:14px}
.journey-mode-heading p{font-size:10.5px}
.journey-mode-heading>em{padding:4px 5px;font-size:10px}

.journey-local-screen .stop-action-grid{grid-template-columns:minmax(0,1fr);flex:1;overflow:visible}
.journey-local-screen .stop-action-card{display:block;padding:0;border-bottom:1px solid rgba(112,127,147,.27)}
.journey-local-screen .stop-action-kicker{font-size:10px}
