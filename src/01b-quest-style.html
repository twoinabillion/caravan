<style id="quest-ledger-style">
/* Approved 상혁의 공책 v3. One notebook owner; tools stay distinct from handwriting. */
#quest-ledger-fallback{position:fixed;right:16px;bottom:90px;z-index:940;display:grid;gap:2px;min-width:92px;padding:11px;border:1px solid #718577;border-radius:3px;background:#363f32;color:#e5d6ad;font:14px/1.4 var(--sans)}
#quest-ledger-fallback[hidden]{display:none}#quest-ledger-fallback span{font-size:12px}
#quest-ledger[aria-hidden="true"]{display:none}
#quest-ledger{--ql-paper:#e9e1c7;--ql-ink:#2e4651;--ql-pencil:#665e47;--ql-cloth:#424b3e;--ql-desk:#242d29;--ql-rule:30px;--ql-hand:"Caravan Journal Hand",var(--sans);position:fixed;z-index:950;inset:0 0 calc(72px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;overflow:hidden;background:var(--ql-desk);color:var(--ql-ink);font-family:var(--sans)}
.quest-ledger-open{overflow:hidden}
.quest-ledger-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px;align-items:center;min-height:50px;padding:2px 18px 2px 5px;color:#e1d7b9}
.quest-ledger-head button{width:44px;height:44px;font:32px/1 var(--sans);color:inherit}
.quest-ledger-head h2{margin:0;font:400 27px/1 var(--ql-hand);color:inherit}
.quest-ledger-head small{font:400 19px/1 var(--ql-hand);color:#c7c6b3}
.quest-ledger-head button:focus-visible,.quest-ledger-tabs button:focus-visible{outline:2px solid #e6bb68;outline-offset:-3px}
.quest-ledger-tabs{display:flex;align-items:end;gap:6px;margin:0 22px 0 42px;position:relative;z-index:2}
.quest-ledger-tabs button{display:flex;justify-content:center;align-items:center;flex:1;min-width:0;min-height:44px;padding:6px 2px;color:#26382e;background:#abb6a2;border:1px solid #6c7665;border-bottom:0;border-radius:3px 5px 0 0;font:400 19px/1.2 var(--ql-hand);box-shadow:inset 0 -5px 5px #333b2422}
.quest-ledger-tabs [data-quest-tab="side"]{background:#b9b69d;transform:rotate(.5deg);transform-origin:bottom left}
.quest-ledger-tabs [data-quest-tab="completed"]{background:#a9b8b4;transform:rotate(-.6deg);transform-origin:bottom right}
.quest-ledger-tabs button.active{background:var(--ql-paper);border-color:#d4cdb4;box-shadow:none;transform:none;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
.quest-ledger-summary{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 14px 0 10px;padding:7px 13px 5px 30px;background:var(--ql-cloth);color:#e1d7b9;font:400 20px/1.3 var(--ql-hand);border:1px solid #636956;border-bottom:0}
.quest-ledger-summary[hidden]{display:none}.quest-ledger-summary em{font-style:normal;white-space:nowrap}
.quest-notebook-cover{grid-row:4;min-height:0;position:relative;margin:0 14px 6px 10px;padding:5px 7px 10px 15px;background:var(--ql-cloth);border:1px solid #636956;border-radius:3px 7px 7px 3px;box-shadow:2px 5px 10px #0005,inset 0 0 0 2px #333d32}
.quest-notebook-cover::before{content:"";position:absolute;inset:8px 5px 5px 17px;background:repeating-linear-gradient(0deg,#c2b99b 0 1px,#e3d9bc 1px 3px);border:1px solid #aca385;border-radius:0 4px 4px 0;transform:rotate(.3deg);pointer-events:none}
.quest-notebook-sheet{height:100%;position:relative;isolation:isolate;background:var(--ql-paper);border-radius:1px 4px 4px 1px;box-shadow:1px 1px 2px #5d553a50,3px 3px 0 #d8cfb3,4px 4px 0 #b6ad8e}
.quest-notebook-sheet::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;background:linear-gradient(90deg,#5c563d42,transparent 9px,#fff5 16px,transparent 25px),linear-gradient(270deg,#5f5a2710,transparent 12px)}
.quest-notebook-binding{position:absolute;left:-12px;top:19px;bottom:20px;width:23px;z-index:3;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 32px,#342f20 32px 34px,#d0c7a7 34px 36px,#665f48 36px 37px,transparent 37px 64px);border-radius:3px;opacity:.9}
.quest-ledger-list{height:100%;min-height:0;overflow:auto;padding:19px 16px 30px 30px;background:linear-gradient(90deg,transparent 23px,#b66d5c44 23px 24px,transparent 24px),repeating-linear-gradient(0deg,transparent 0 calc(var(--ql-rule) - 1px),#7c999533 calc(var(--ql-rule) - 1px) var(--ql-rule));background-attachment:local;overscroll-behavior:contain;scroll-padding-block:16px;scrollbar-width:thin;scrollbar-color:#b5ad94 transparent;word-break:keep-all;overflow-wrap:anywhere}
.quest-ledger-list:focus-visible{outline:2px solid #92763c;outline-offset:-3px}
.quest-ledger-card{position:relative;min-width:0;margin:0 0 30px;padding:0 0 30px;border-bottom:1px solid #857c5d66;color:var(--ql-ink)}
.quest-ledger-card:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
.quest-card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 12px;color:var(--ql-pencil);font:400 20px/30px var(--ql-hand)}
.quest-card-top b{font:inherit;text-decoration:underline;text-underline-offset:4px;white-space:nowrap}
.quest-ledger-card h3,.quest-ledger-empty h3{margin:0 0 22px;font:400 32px/30px var(--ql-hand);letter-spacing:0;color:var(--ql-ink);text-wrap:pretty}
.quest-next,.quest-ledger-empty p{margin:0;font:400 25px/var(--ql-rule) var(--ql-hand);letter-spacing:0}
.quest-margin-aside{width:fit-content;max-width:100%;margin:12px 1px 2px auto;padding:0 3px;color:var(--ql-pencil);font:400 21px/26px var(--ql-hand)}
.quest-margin-aside p{margin:0}
.quest-crossed-thought{transform:rotate(-1.5deg);transform-origin:center}
.quest-crossed-thought del{display:inline-block;position:relative;text-decoration:none;padding:0 2px}
.quest-pen-crossout{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;fill:none;stroke:var(--ql-ink);stroke-width:1.35;stroke-linecap:round;opacity:.8}
.quest-margin-aside .quest-added-thought{display:flex;align-items:center;gap:3px;margin-left:15px;padding-top:1px;transform:rotate(1deg);transform-origin:left;color:var(--ql-ink)}
.quest-pen-arrow{width:23px;height:25px;flex:none;fill:none;stroke:currentColor;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}
.quest-pencil-note{width:fit-content;margin:20px 0 19px;padding-bottom:1px;border-bottom:1px solid #857c5d;transform:rotate(-1deg);color:var(--ql-pencil);font:400 22px/var(--ql-rule) var(--ql-hand)}
.quest-dalguji-doodle{display:block;width:77px;height:38px;margin:10px 2px 0 auto;fill:none;stroke:var(--ql-pencil);stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;transform:rotate(-3deg);pointer-events:none}
.quest-pen-retrace{opacity:.45;stroke-width:.8}
.quest-evidence,.quest-receipt,.quest-main-history{margin-top:20px;font:400 24px/var(--ql-rule) var(--ql-hand)}
#quest-ledger :is(.quest-evidence,.quest-receipt,.quest-main-history)>summary{display:flex;align-items:center;gap:10px;min-height:44px;width:fit-content;max-width:100%;cursor:pointer;color:var(--ql-pencil);list-style:none;font:400 23px/var(--ql-rule) var(--ql-hand);text-decoration:underline dotted #857c5d;text-underline-offset:5px}
#quest-ledger :is(.quest-evidence,.quest-receipt,.quest-main-history)>summary::-webkit-details-marker{display:none}
#quest-ledger :is(.quest-evidence,.quest-receipt,.quest-main-history)>summary::after{content:"";width:7px;height:7px;flex:none;border-right:1px solid;border-bottom:1px solid;transform:rotate(-45deg)}
#quest-ledger :is(.quest-evidence,.quest-receipt,.quest-main-history)[open]>summary::after{transform:rotate(45deg)}
.quest-main-steps{display:grid;gap:18px;margin:8px 0 0;padding:0;list-style:none}
.quest-main-steps li{padding:0;background:none}
.quest-main-steps b{display:block;font:400 23px/var(--ql-rule) var(--ql-hand);color:var(--ql-pencil)}
.quest-main-steps p,.quest-receipt p,.quest-main-history p{margin:0;font:400 24px/var(--ql-rule) var(--ql-hand)}
.quest-card-phase{margin:18px 0 0;color:var(--ql-pencil);font:400 20px/26px var(--ql-hand)}
.quest-progress{height:2px;margin:18px 0 5px;background:#857c5d33;transform:rotate(-.3deg)}
.quest-progress i{display:block;height:100%;background:#68715b}
.quest-progress-label{margin:0 0 12px;color:var(--ql-pencil);font:400 20px/26px var(--ql-hand)}
.quest-main-history article{padding:14px 0}.quest-main-history h3{margin:0 0 5px;font:400 26px/var(--ql-rule) var(--ql-hand)}
.quest-main-history small{display:block;color:var(--ql-pencil);font:400 20px/26px var(--ql-hand)}
.quest-ledger-empty{padding:12px 0 0}
.quest-ledger-tools{padding:6px 19px 10px 23px;color:#e7e6d6;grid-row:5}
.quest-ledger-tools[hidden]{display:none}
.quest-guide{margin:0 0 9px;color:#c9cebf;font:12px/1.5 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
.quest-action-button,.quest-track-button,.quest-return-road{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:44px;width:100%;margin:0;padding:10px 14px;border:1px solid #7e896c;border-radius:3px;background:#3c4b3d;color:#f1eedc;box-shadow:inset 0 1px #c7d0b518;font:600 14px/1.5 var(--sans);text-align:left;word-break:keep-all;overflow-wrap:anywhere}
.quest-action-button::after{content:"↗";flex-shrink:0;font:20px/1 var(--sans)}
.quest-action-button:hover,.quest-return-road:hover{background:#354232}
#quest-ledger :is(.quest-action-button,.quest-track-button,.quest-return-road,summary):focus-visible{outline:2px solid #ad813b;outline-offset:2px}
.quest-card-tools{margin:18px 0 0;padding:12px;background:var(--ql-cloth);border-radius:2px;box-shadow:1px 2px 0 #aaa084}
.quest-track-button{margin-top:7px;justify-content:center;background:transparent;color:#f1eedc;border-color:#90977e;box-shadow:none;font-weight:400}
.quest-track-button:hover{background:#56624c}
#dock button.has-quest-update .dic::after,#quest-ledger-fallback.has-quest-update::after{content:"";position:absolute;top:0;right:-5px;width:8px;height:8px;border:1px solid #121a1b;border-radius:50%;background:#f3c47d;box-shadow:0 0 0 2px #121a1b}
#dock button.has-quest-update{color:#f3c47d}#quest-ledger-fallback.has-quest-update::after{top:7px;right:7px}
@media(min-width:480px){#quest-ledger{left:50%;right:auto;width:480px;transform:translateX(-50%)}}
@media(max-width:330px){.quest-notebook-cover{margin-left:7px;margin-right:10px}.quest-ledger-tabs{margin-left:34px;margin-right:17px;gap:4px}.quest-ledger-tabs button{font-size:18px}.quest-ledger-list{padding-right:13px}.quest-ledger-head{padding-right:13px}.quest-ledger-tools{padding-left:19px;padding-right:16px}}
@media(max-height:620px){.quest-ledger-head{min-height:44px;padding-block:0}.quest-ledger-list{padding-top:13px}.quest-ledger-tools{padding-top:4px;padding-bottom:8px}}
html.ui-large-text #quest-ledger{--ql-rule:34px}
html.ui-large-text #quest-ledger :is(.quest-next,.quest-ledger-empty p,.quest-main-steps p,.quest-main-history p,.quest-receipt p){font-size:28px}
html.ui-large-text #quest-ledger :is(.quest-card-phase,.quest-progress-label,.quest-main-history small,.quest-card-top){font-size:23px;line-height:1.35}
html.ui-large-text #quest-ledger :is(.quest-pencil-note,.quest-margin-aside){font-size:25px;line-height:1.35}
html.ui-large-text #quest-ledger .quest-guide{font-size:var(--reading-detail-size);line-height:1.5}
html.ui-large-text #quest-ledger :is(.quest-action-button,.quest-track-button,.quest-return-road){font-size:var(--reading-choice-size);line-height:1.4}
</style>
