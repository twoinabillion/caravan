<style id="quest-ledger-style">
#quest-ledger-fallback{position:fixed;right:16px;bottom:90px;z-index:940;display:grid;gap:2px;min-width:92px;padding:11px;border:1px solid #718577;border-radius:3px;background:#193b35;color:#e5d6ad;font:14px/1.4 var(--sans)}
#quest-ledger-fallback[hidden]{display:none}#quest-ledger-fallback span{font-size:12px}
#quest-ledger[aria-hidden="true"]{display:none}
#quest-ledger{--ql-bg:#153631;--ql-line:#557266;position:fixed;z-index:950;inset:0 0 calc(72px + env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto minmax(0,1fr);overflow:hidden;background:var(--ql-bg);color:#eee8d5;box-shadow:inset 0 0 0 5px #102b27;border:1px solid #7f8d79}
.quest-ledger-open{overflow:hidden}
.quest-ledger-head{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;min-height:75px;padding:12px 16px 8px}
.quest-ledger-head button{width:44px;height:44px;font:32px/1 var(--sans);color:#e1d9bd}
.quest-ledger-head h2{margin:0;font:400 27px/1.25 var(--journey-display);color:#eee5ce}
.quest-ledger-head button:focus-visible,.quest-ledger-tabs button:focus-visible{outline:2px solid #efd09a;outline-offset:-2px}
.quest-ledger-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0 20px;border-bottom:1px solid var(--ql-line)}
.quest-ledger-tabs button{min-height:48px;padding:10px 3px;color:#b9c9b9;font:600 14px/1.3 var(--sans)}
.quest-ledger-tabs button.active{color:#f1d8a3;box-shadow:inset 0 -3px #dfbd7c}
.quest-ledger-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 20px 0;font-size:13px;color:#c4d0be}
.quest-ledger-summary[hidden]{display:none}.quest-ledger-summary strong{font-size:13px;font-weight:500}.quest-ledger-summary small{display:block;margin-top:5px;font-size:12px}.quest-ledger-summary em{font-size:12px;color:#dfc98e;font-style:normal;white-space:nowrap}
.quest-ledger-list{grid-row:4;min-height:0;overflow:auto;padding:26px 22px calc(30px + env(safe-area-inset-bottom));overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#85957e transparent}
.quest-ledger-card{position:relative;min-width:0;margin:0 0 26px;padding:0 0 24px;border-bottom:1px solid #617b6b;color:#e9e3cd;word-break:keep-all;overflow-wrap:break-word}
.quest-card-top{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#c6bb90;font-size:12px}
.quest-card-top b{font-size:12px;color:#b4d5b9;font-weight:600}
.quest-ledger-card h3{margin:14px 0 12px;font:400 29px/1.28 var(--journey-display);letter-spacing:-.02em;color:#f0e8d2;text-wrap:pretty}
.quest-card-phase{margin:0 0 24px;color:#b9cbb8;font-size:14px;line-height:1.65}
.quest-clue-note{position:relative;margin:0;padding:19px 19px 20px;border-left:3px solid #b7b995;background:#dcdcc5;color:#233b31;box-shadow:3px 4px 0 #092822}
.quest-clue-note::before{content:"";position:absolute;right:14px;top:-5px;width:26px;height:7px;background:#859684;border:1px solid #adc0a4}
.quest-clue-label{display:block;margin-bottom:10px;color:#4a6250;font-size:12px;font-weight:700}
.quest-next{margin:0;font-size:16px;line-height:1.75;font-weight:600}
.quest-action-button,.quest-track-button,.quest-return-road{display:block;min-height:48px;width:100%;margin:17px 0 0;padding:13px 16px;border:1px solid #a6b191;border-bottom:3px solid #71836c;border-radius:2px;background:#cdd5b9;color:#1b3a2e;font:800 15px/1.5 var(--sans);text-align:left}
.quest-action-button:hover,.quest-action-button:focus-visible,.quest-return-road:hover{background:#e0e4cd;outline:2px solid #ebd5a3;outline-offset:2px}
.quest-track-button{background:transparent;color:#dfd5b6;border:1px solid #738775;font-size:14px}
.quest-context,.quest-evidence{margin-top:12px;border-top:1px solid #4b6b5e}
.quest-context>summary,.quest-evidence>summary{min-height:48px;padding:14px 0;font-size:14px;color:#d7d8bc;cursor:pointer}
.quest-evidence>summary span{margin-left:7px;color:#b1c4b0;font-size:12px}
.quest-context p{margin:0 0 16px;color:#bdcfba;font-size:14px;line-height:1.8}
.quest-context .quest-recovery{padding-left:12px;border-left:2px solid #9cae87}
.quest-main-steps{margin:0;padding:0;list-style:none}
.quest-main-steps li{display:grid;grid-template-columns:12px minmax(0,1fr);gap:12px;padding:13px 0;border-top:1px solid #426353}
.quest-main-steps i{display:block;width:6px;height:6px;margin-top:9px;background:#b9cea3;transform:rotate(45deg)}
.quest-main-steps b{display:block;color:#e2e2c9;font-size:14px;line-height:1.65;font-weight:600}.quest-main-steps small{display:block;margin-top:5px;color:#b9cbb3;font-size:13px;line-height:1.7}
.quest-progress{height:4px;margin:15px 0 5px;background:#092922}.quest-progress i{display:block;height:100%;background:#d2bf88}
.quest-progress-label{display:flex;justify-content:space-between;margin-bottom:16px;color:#b9cbb8;font-size:12px}.quest-progress-label strong{font-weight:500}
.quest-main-history{margin:0 0 12px}.quest-main-history>h3{margin:0 0 16px;font:400 19px/1.4 var(--journey-display);color:#d4d8bc}
.quest-main-history article{padding:14px 0;border-top:1px solid #426353}.quest-main-history article small{display:block;color:#c9bd91;font-size:12px}.quest-main-history article b{display:block;margin:4px 0;font-size:15px;font-weight:600}.quest-main-history article span{display:block;color:#b9cbb8;font-size:13px;line-height:1.6}
.quest-ledger-empty{padding:12px 0 0;word-break:keep-all;overflow-wrap:break-word}
.quest-empty-mark{width:48px;height:56px;margin-bottom:25px;border:1px solid #9cac8f;border-left:4px solid #c9c5a1;box-shadow:5px 5px 0 #214a3f;background:repeating-linear-gradient(transparent 0 13px,#56735f 13px 14px)}
.quest-ledger-empty h3{margin:0 0 16px;font:400 28px/1.3 var(--journey-display);color:#eee6cd}
.quest-ledger-empty p{margin:0 0 26px;color:#c1ceb8;font-size:15px;line-height:1.85}
#dock button.has-quest-update .dic::after,#quest-ledger-fallback.has-quest-update::after{content:"";position:absolute;top:0;right:-5px;width:8px;height:8px;border:1px solid #121a1b;border-radius:50%;background:#f3c47d;box-shadow:0 0 0 2px #121a1b}
#dock button.has-quest-update{color:#f3c47d}#quest-ledger-fallback.has-quest-update::after{top:7px;right:7px}
@media(min-width:480px){#quest-ledger{left:50%;right:auto;width:480px;transform:translateX(-50%)}}
@media(max-width:360px){.quest-ledger-list{padding-left:17px;padding-right:17px}.quest-ledger-card h3{font-size:26px}.quest-clue-note{padding:16px}.quest-ledger-tabs{margin-left:13px;margin-right:13px}}
@media(max-height:650px){
  .quest-ledger-head{min-height:60px;padding-top:7px;padding-bottom:7px}
  .quest-ledger-tabs button{min-height:42px;padding-top:8px;padding-bottom:8px}
  .quest-ledger-list{padding-top:14px}
  .quest-ledger-card h3{margin-top:10px;margin-bottom:8px}
  .quest-card-phase{margin-bottom:14px}
  .quest-clue-note{padding:14px}
  .quest-clue-label{margin-bottom:6px}
  .quest-action-button{margin-top:12px}
}
html.ui-large-text #quest-ledger :is(.quest-next,.quest-card-phase,.quest-context p,.quest-main-steps b,.quest-main-steps small,.quest-ledger-empty p){font-size:var(--reading-detail-size);line-height:1.7}
html.ui-large-text #quest-ledger :is(.quest-action-button,.quest-track-button,.quest-return-road){font-size:var(--reading-choice-size);line-height:1.4}
</style>
