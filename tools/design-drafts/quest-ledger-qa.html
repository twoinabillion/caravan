(async()=>{

   const template=document.createElement('template');template.innerHTML=match[0];document.head.append(template.content);
 }
 const script=document.createElement('script');script.src='/game/src/07d-ui-quests.js';
 script.onload=()=>{QuestLedgerUI.open();document.querySelector('#qa-large').onclick=()=>{document.documentElement.classList.toggle('ui-large-text');QuestLedgerUI.open()};
 document.querySelector('#qa-side').onclick=()=>{qaSide=!qaSide;QuestLedgerUI.tab='side';QuestLedgerUI.open()};
 document.querySelector('#qa-rerender').onclick=()=>QuestLedgerUI.open();};document.body.append(script);
})();
