<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>풍경 곁의 대화</title><style>*{box-sizing:border-box}body{margin:0;background:#090f16;color:#eee9dc;font:16px/1.6 system-ui,sans-serif}main{width:min(480px,100%);min-height:100dvh;margin:auto;display:flex;flex-direction:column;justify-content:center;background:#142027}header{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 16px;color:#c2c8c6;font-size:12px}button{font:inherit;cursor:pointer}header button{border:0;background:none;color:inherit;min-height:44px}figure{position:relative;margin:0}figure img{display:block;width:100%;height:auto}#zoom{position:absolute;right:10px;top:10px;min-height:44px;padding:8px 12px;background:#142027df;color:#eee9dc;border:1px solid #697574;border-radius:3px}article{margin:8px;padding:16px;background:#293239;border:1px solid #637170;border-radius:3px}p{margin:0 0 16px;color:#cbd0cb}.choices{display:grid;gap:8px}.choices button{min-height:54px;padding:12px 16px;border:1px solid #8a8c7b;border-radius:3px;background:linear-gradient(#666c61,#525d54);color:#f1eddf;text-align:center;font-weight:600;box-shadow:inset 0 1px #ffffff16}.quiet{display:flex;align-items:center;justify-content:space-between;margin-top:10px;font-size:12px;color:#c2c8c6}.quiet button{min-height:44px;border:0;background:none;color:inherit}dialog{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;margin:0;padding:0;border:0;background:#080d12;color:#eee9dc}dialog[open]{display:flex;flex-direction:column}dialog::backdrop{background:#080d12}nav{display:flex;justify-content:flex-end;gap:12px;padding:8px}nav button{min-height:44px;padding:8px 16px;border:1px solid #68726a;background:#202a2e;color:#eee9dc}.viewport{flex:1;min-height:0;overflow:auto;display:grid;place-items:center}.viewport img{width:100%;height:100%;object-fit:contain}.viewport.detail{display:block}.viewport.detail img{width:200%;max-width:none;height:auto}small.note{display:block;position:absolute;left:10px;bottom:7px;color:#d0d4c9;background:#142027c9;padding:3px 6px;font-size:10px}</style><main><header><span>지금 · 폐쇄 요금소</span><button>기록</button></header><figure><img src="../../assets/scenes/story-bridge-trace-gap-v1.webp" alt="고화질 요금소 장면"><button id="zoom">그림 크게 보기</button><small class="note">독립 배치 초안 · 실제 게임·저장과 분리</small></figure><article><p>폐쇄된 요금소 제어실에서 기록지가 아직도 조금씩 밀려 나오고 있었다. 자동 명령 발행 03:12. 버스 출발 03:16. 사람 확인 03:23. 확인자 칸은 비어 있었다.</p><div class="choices"><button>세 장의 시각을 나란히 적는다</button><button>비어 있는 확인란을 그대로 남긴다</button></div><div class="quiet"><button>앞 대사</button><span>본문과 선택지를 가까이</span></div></article></main><dialog aria-label="그림 크게 보기"><nav><button id="detail" aria-pressed="false">세부 확대</button><button id="close">닫기</button></nav><div class="viewport"><img src="../../assets/scenes/story-bridge-trace-gap-v1.webp" alt="요금소 전체 그림"></div></dialog><script>const d=document.querySelector('dialog'),v=document.querySelector('.viewport'),b=document.querySelector('#detail');document.querySelector('#zoom').onclick=()=>d.showModal();document.querySelector('#close').onclick=()=>d.close();b.onclick=()=>{const on=v.classList.toggle('detail');b.setAttribute('aria-pressed',on);b.textContent=on?'전체 그림':'세부 확대'}</script></html>
