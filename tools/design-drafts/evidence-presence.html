<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="evidence-presence.css"><title>이야기가 가리키는 사물</title><main><header><small>CARAVAN · 독립 연출 초안 / 실제 저장과 분리</small><h1>말하는 물건이,<br>그 순간 보이도록.</h1><p>아래 ‘다음 대목’을 누르면 현장 → 기록지 → 현장 순서로 이어집니다. 본게임에서는 실제 읽는 페이지와 연결합니다.</p></header><figure><img src="../../assets/scenes/story-bridge-trace-gap-v1.webp" alt="기존 고화질 요금소"><button id="object" hidden aria-label="운행 기록지 크게 보기"><span class="paper-title">운행 기록지</span><span class="row"><span>자동 명령 발행</span><b>03:12</b></span><span class="row"><span>버스 출발</span><b>03:16</b></span><span class="row"><span>사람 확인</span><b>03:23</b></span><span class="row"><span>확인자</span><b>________</b></span><span class="hint">누르면 전체 기록지</span></button></figure><article><small id="step">현장</small><p id="line">기존 고화질 장면과 사람을 먼저 봅니다.</p><button id="next">다음 대목</button></article><dialog><article><button id="close">이야기로 돌아가기</button><h2>운행 기록지</h2><p>자동 명령 발행　03:12<br>버스 출발　　　03:16<br>사람 확인　　　03:23<br>확인자　　　　________</p></article></dialog></main><script>let step=0;const $=s=>document.querySelector(s),copy=[['현장','기존 고화질 장면과 사람을 먼저 봅니다.'],['발견한 물건','기록지가 등장하는 대목에는 자료 버튼을 찾지 않아도 물건과 내용이 바로 보입니다.'],['다시 현장','물건을 살피는 대목이 지나가면 다시 풍경과 얼굴로 돌아옵니다.']];$('#next').onclick=()=>{step=(step+1)%3;$('#step').textContent=copy[step][0];$('#line').textContent=copy[step][1];$('#object').hidden=step!==1};$('#object').onclick=()=>$('dialog').showModal();$('#close').onclick=()=>$('dialog').close();</script></html>
