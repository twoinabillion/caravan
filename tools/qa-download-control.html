<!doctype html><html lang="ko"><meta charset="utf-8"><title>백업 다운로드 비교 검수</title>
<style>body{max-width:700px;margin:30px auto;padding:20px;font:16px/1.6 system-ui}a,button{display:block;margin:20px 0;padding:12px;border:1px solid #555}output{display:block}</style>
<h1>다운로드 비교 검수</h1><p>게임·저장과 연결하지 않은 작은 기준 파일입니다. 도구 수신 여부를 백업 기능 자체와 구분합니다.</p>
<a href="qa-download-control.json" download="caravan-download-control.json">정적 기준 파일 다운로드</a><button>Blob 기준 파일 다운로드</button><output aria-live="polite"></output>
<script>document.querySelector('button').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['{"fixtureOnly":true,"purpose":"blob-download-control"}'],{type:'application/json'}));a.href=url;a.download='caravan-blob-control.json';a.hidden=true;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('output').textContent='기준 파일 다운로드를 요청했습니다. 이 문구만으로 완료를 판정하지 않습니다.';};</script></html>
