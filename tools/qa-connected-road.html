<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>연결 풍경 · 실제 렌더러 분리 검수</title>
<style>body{margin:20px;background:#111923;color:#e5e8e9;font:15px/1.6 system-ui}main{max-width:600px;margin:auto}h1{font-size:20px}canvas{display:block;width:360px;height:344px;max-width:100%;background:#121b27}fieldset{margin:12px 0;border:1px solid #55616b}label{display:inline-block;margin:4px}button,select,input{font:inherit}button{margin:4px;padding:6px 12px}pre{white-space:pre-wrap;font-size:12px}a{color:#8ed5ff}</style>
<main><h1>연결 풍경 · 실제 렌더러 분리 검수</h1><p>게임 저장을 읽거나 쓰지 않는 테스트 화면. 실제 SCENE·ROAD_CONTINUITY·차량 렌더러를 사용하며, 사건·이동 상태는 검사 입력입니다. 실제 플레이 완주가 아닙니다.</p>
<canvas id="road" aria-label="검수용 도로 풍경"></canvas>
<fieldset><legend>장소와 진행</legend><label>구간 <select id="leg"><option value="0">부산 → 양산</option><option value="1">양산 → 밀양</option><option value="2">밀양 → 양산</option><option value="3">양산 → 부산</option></select></label><label>진행 <input id="progress" type="range" min="0" max="100" step="1" value="0"></label><button id="play">재생</button><button id="pause">일시정지</button><button id="arrive">도착·정차</button><button id="depart">다음 구간 출발</button><button id="encounter">사건 제동</button><button id="resume">사건 종료·재출발</button><button id="reload">JSON 저장 재개</button></fieldset>
<fieldset><legend>화면 조건</legend><label>너비 <select id="width"><option>320</option><option selected>360</option><option>480</option></select></label><label>시간 <select id="hour"><option value="12">낮</option><option value="18">해 질 녘</option><option value="0">밤</option></select></label><label>날씨 <select id="weather"><option value="clear">맑음</option><option value="rain">비</option><option value="storm">폭풍</option><option value="fog">안개</option></select></label><label><input type="checkbox" id="upgrade">생활칸 개조</label></fieldset>
<pre id="status">렌더러 로딩 중…</pre><pre id="checks"></pre></main><script type="module" src="qa-connected-road.mjs"></script></html>
